<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Strings</title>
<meta name="theme-color" content="#0f5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Strings">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script>try { if (localStorage.getItem("rs_sol") === "true") document.documentElement.classList.add("sol"); } catch (e) {}</script>
<style>
:root {
  --bg: #f3f5f4;
  --card: #ffffff;
  --text: #14201b;
  --muted: #5b6b64;
  --line: #d5ddd9;
  --accent: #0f5132;
  --accent-text: #ffffff;
  --ok: #198754;
  --ok-bg: #d1f0de;
  --warn: #9a6200;
  --warn-bg: #fff0c2;
  --pend: #6c7a73;
  --pend-bg: #e7ecea;
  --err: #b42318;
  --err-bg: #fde4e1;
  --borde: 1px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1412;
    --card: #17201c;
    --text: #e7efeb;
    --muted: #9db0a7;
    --line: #2b3832;
    --accent: #3fb57e;
    --accent-text: #06120c;
    --ok: #5fd39a;
    --ok-bg: #173826;
    --warn: #f2c14e;
    --warn-bg: #3a2f10;
    --pend: #9db0a7;
    --pend-bg: #222d29;
    --err: #ff8a7a;
    --err-bg: #3d1a16;
  }
}
/* Modo sol: máximo contraste y letra grande, siempre claro */
html.sol {
  --bg: #ffffff;
  --card: #ffffff;
  --text: #000000;
  --muted: #1f1f1f;
  --line: #000000;
  --accent: #003d1f;
  --accent-text: #ffffff;
  --ok: #00561b;
  --ok-bg: #a9f0bd;
  --warn: #6b3d00;
  --warn-bg: #ffd966;
  --pend: #000000;
  --pend-bg: #dedede;
  --err: #a00000;
  --err-bg: #ffc2ba;
  --borde: 2px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: calc(10px + env(safe-area-inset-top)) 10px 10px;
  background: var(--accent); color: var(--accent-text);
}
header h1 { flex: 1; margin: 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header button {
  background: transparent; color: inherit; border: 1px solid currentColor;
  border-radius: 10px; padding: 8px 10px; font-size: 15px; position: relative; white-space: nowrap;
}
header button.icono { border: none; font-size: 22px; padding: 4px 8px; }
#btnNube { font-size: 14px; padding: 6px 8px; }
#btnNube.error { background: var(--err); color: #fff; border-color: var(--err); }
.badge {
  position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 10px; background: var(--err); color: #fff; font-size: 12px; line-height: 20px; text-align: center;
}
main { max-width: 720px; margin: 0 auto; padding: 14px 16px 90px; }
.card { background: var(--card); border: var(--borde) solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
h2 { font-size: 17px; margin: 4px 0 10px; }
.muted { color: var(--muted); font-size: 14px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input, select, textarea {
  width: 100%; font-size: 18px; padding: 12px; border-radius: 10px;
  border: var(--borde) solid var(--line); background: var(--bg); color: var(--text); font-family: inherit;
}
input::placeholder { text-transform: none; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input[type=checkbox] { width: 22px; height: 22px; padding: 0; vertical-align: middle; margin: 0 8px 0 0; }
label.check { display: flex; align-items: center; font-size: 15px; color: var(--text); margin: 10px 0; }
.btn {
  display: block; width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
  border-radius: 12px; border: none; background: var(--accent); color: var(--accent-text); margin-top: 10px; font-family: inherit;
}
.btn.sec { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.peligro { background: transparent; color: var(--err); border: 1.5px solid var(--err); }
.btn:disabled { opacity: .45; }
a.enlace { text-align: center; text-decoration: none; }

.lista-sc { display: grid; gap: 10px; }
.sc {
  display: block; text-decoration: none; color: inherit;
  background: var(--card); border: var(--borde) solid var(--line); border-radius: 14px; padding: 14px;
}
.sc .top { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 18px; }
.barra { height: 8px; border-radius: 4px; background: var(--pend-bg); overflow: hidden; margin-top: 8px; display: flex; }
.barra i { display: block; height: 100%; }
.barra .c { background: var(--ok); }
.barra .p { background: var(--warn); }

.filtros { display: flex; gap: 8px; margin-bottom: 12px; }
.filtros input { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: var(--borde) solid var(--line); background: var(--card); color: var(--text); border-radius: 20px; padding: 6px 12px; font-size: 14px; }
.chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.grid-t { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.t {
  display: block; text-align: center; text-decoration: none; padding: 12px 4px; border-radius: 10px;
  font-weight: 600; font-size: 16px; border: var(--borde) solid transparent;
}
.t small { display: block; font-weight: 400; font-size: 11px; opacity: .85; }
.st-completo { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.st-parcial { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.st-pendiente { background: var(--pend-bg); color: var(--pend); }

.ficha-id { font-size: 26px; font-weight: 700; letter-spacing: .5px; margin: 0; word-break: break-all; }
.estado { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-top: 6px; }
.segm { display: flex; border: 1.5px solid var(--accent); border-radius: 12px; overflow: hidden; }
.segm button { flex: 1; padding: 12px; font-size: 17px; font-weight: 600; border: none; background: transparent; color: var(--accent); font-family: inherit; }
.segm button.on { background: var(--accent); color: var(--accent-text); }
.str { display: grid; grid-template-columns: 34px 1fr 1.25fr 1fr; gap: 6px; align-items: end; padding: 10px 0; border-top: var(--borde) solid var(--line); }
.str:first-of-type { border-top: none; }
.str .n { font-weight: 700; font-size: 17px; padding-bottom: 13px; text-align: center; }
.str input, .str select { font-size: 16px; padding: 12px 8px; }
.str .info, .pv .info { grid-column: 1 / -1; font-size: 13px; }
.info a { color: var(--accent); font-weight: 600; }
.guardado { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; min-height: 18px; }
.nav-t { display: flex; gap: 10px; }
.nav-t .btn { flex: 1; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }

.pv { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-top: var(--borde) solid var(--line); }
.pv .n { font-weight: 700; font-size: 17px; padding-top: 12px; }
.pv .n small { display: block; font-size: 11px; font-weight: 400; }
.pv.vacio .n { color: var(--muted); }
.pv .info { margin-top: 4px; }
.pv-btn {
  display: block; width: 100%; text-align: left; padding: 12px; border-radius: 10px; font-size: 15px; font-family: inherit;
  border: var(--borde) solid var(--line); background: var(--bg); color: var(--text);
}
.pv-btn.libre { color: var(--muted); border-style: dashed; }
.pv.vacio .pv-btn.libre { opacity: .6; }
h2.mppt { font-size: 14px; color: var(--muted); margin: 14px 0 0; }
h2.mppt:first-child { margin-top: 0; }
h2.mppt + .pv { border-top: none; }
.panel { display: grid; grid-template-columns: repeat(2, 1fr) 6px repeat(5, 1fr); gap: 4px; margin: 10px 0; }
.panel button { display: block; text-align: center; font-size: 13px; font-weight: 600; padding: 0; border-radius: 50%; aspect-ratio: 1; border: 1.5px solid transparent; font-family: inherit; background: none; color: inherit; }
.panel .sep { display: block; }
.c-ok { background: var(--ok-bg) !important; color: var(--ok) !important; border-color: var(--ok) !important; }
.c-falta { background: var(--pend-bg) !important; color: var(--text) !important; border-color: var(--pend) !important; }
.c-err { background: var(--err-bg) !important; color: var(--err) !important; border-color: var(--err) !important; }
.c-vacio { color: var(--muted) !important; border: 1.5px dashed var(--line) !important; }
.leyenda span { font-size: 16px; }
.directo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; margin-top: 10px; }
.directo .btn { margin-top: 0; }

/* Buscador de strings (hoja inferior) */
#hoja { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45); display: none; }
#hoja.ver { display: flex; align-items: flex-end; justify-content: center; }
.hoja-panel {
  background: var(--card); color: var(--text); width: 100%; max-width: 720px; max-height: 88vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
}
.hoja-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.hoja-top b { flex: 1; font-size: 19px; }
.hoja-top button { border: none; background: var(--pend-bg); color: var(--text); font-size: 18px; border-radius: 50%; width: 38px; height: 38px; }
#hQ { font-size: 22px; letter-spacing: 1px; }
.res {
  display: block; width: 100%; text-align: left; margin-top: 8px; padding: 12px; border-radius: 12px; font-family: inherit;
  border: var(--borde) solid var(--line); background: var(--bg); color: var(--text); font-size: 15px;
}
.res b { font-size: 17px; }
.res small { display: block; margin-top: 2px; font-size: 13px; }
.res.propio { border-color: var(--ok); }

.tip { background: var(--warn-bg); color: var(--text); border: 1px solid var(--warn); border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 12px; }
.tip b { color: var(--warn); }
.stat { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: var(--borde) solid var(--line); }
.stat:last-child { border-bottom: none; }
.stat b { white-space: nowrap; }
.tabla a { color: var(--accent); font-weight: 600; }
table.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla th, .tabla td { padding: 6px 4px; border-bottom: var(--borde) solid var(--line); text-align: center; }
.tabla th:first-child, .tabla td:first-child { text-align: left; }
.lista-nov { margin: 0; padding-left: 18px; font-size: 14px; }
.lista-nov li { margin: 4px 0; }
.lista-nov a, .hist a { color: var(--accent); font-weight: 600; }
.hist { border-top: var(--borde) solid var(--line); padding: 10px 0; }
.hist:first-of-type { border-top: none; }
.hist ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.hist .btn { width: auto; padding: 8px 14px; font-size: 15px; margin-top: 8px; }
.hist.deshecho { opacity: .55; }

.toast, #snack {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 15px;
  max-width: calc(100% - 32px);
}
.toast { bottom: calc(24px + env(safe-area-inset-bottom)); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.ver { opacity: 1; }
#snack { top: calc(66px + env(safe-area-inset-top)); display: none; align-items: center; gap: 14px; width: max-content; }
#snack.ver { display: flex; }
#snack button { background: none; border: 1.5px solid currentColor; color: inherit; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 15px; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 24px; }
.oculto { display: none !important; }

/* Modo sol: letra más grande y bordes más marcados */
html.sol body { font-size: 18px; font-weight: 500; }
html.sol .muted, html.sol .str .info, html.sol .pv .info, html.sol .res small { font-size: 16px; }
html.sol label { font-size: 15px; font-weight: 600; }
html.sol h2 { font-size: 20px; }
html.sol .t { font-size: 19px; }
html.sol .t small { font-size: 13px; }
html.sol .pv-btn, html.sol .res { font-size: 17px; }
html.sol .str input, html.sol .str select { font-size: 18px; }
html.sol .btn { font-size: 19px; border-width: 2.5px; }

@media print {
  header, .no-imprimir, #snack, .toast, #hoja { display: none !important; }
  body { background: #fff; color: #000; }
  main { padding: 0; max-width: none; }
  .card { border: 1px solid #999; break-inside: avoid; }
  a { color: #000 !important; text-decoration: none; }
}
</style>
</head>
<body>
<header>
  <button id="btnAtras" class="icono oculto" aria-label="Atrás">‹</button>
  <h1 id="titulo">Registro de Strings</h1>
  <button id="btnSol" class="icono" aria-label="Modo sol (alto contraste)" title="Modo sol">☀</button>
  <button id="btnNube" class="oculto" aria-label="Envío a la oficina"></button>
  <button id="btnExportar">Exportar<span id="badge" class="badge oculto"></span></button>
  <button id="btnConfig" class="icono" aria-label="Ajustes">⚙</button>
</header>
<main id="app"></main>
<div id="hoja"></div>
<div id="snack"><span id="snackTxt"></span><button id="snackBtn">Deshacer</button></div>
<div id="toast" class="toast"></div>

<script src="trackers.js"></script>
<script>
"use strict";
const VERSION = "2.0.0";
// Configuración de la planta: inversores por subcampo y strings por inversor
const INVERSORES = 22, ENTRADAS = 20;
// Conectores del inversor: 28 PV en 6 MPPT. Los 20 "habituales" son los que normalmente van conectados
const PV_TOTAL = 28;
const PV_HABITUALES = new Set([2, 3, 4, 6, 7, 8, 9, 10, 11, 12, 16, 17, 18, 21, 22, 23, 25, 26, 27, 28]);
const MPPT_RANGOS = [[1, 1, 4], [2, 5, 9], [3, 10, 14], [4, 15, 18], [5, 19, 23], [6, 24, 28]];
// Vista frontal del inversor (null = separación entre MPPT)
const PANEL = [
  { arriba: [2, 4, null, 10, 11, 12, 13, 14], abajo: [1, 3, null, 5, 6, 7, 8, 9] },
  { arriba: [16, 18, null, 24, 25, 26, 27, 28], abajo: [15, 17, null, 19, 20, 21, 22, 23] },
];
const K = {
  reg: "rs_registros", tec: "rs_tecnico", exp: "rs_ultima_exportacion", cambios: "rs_cambios",
  ultSc: "rs_ultimo_subcampo", ultInv: "rs_ultimo_inversor", hist: "rs_historial", sol: "rs_sol", auto: "rs_avance_auto",
  sync: "rs_sync_pendientes", syncUrl: "rs_sync_url", syncClave: "rs_sync_clave", syncDesde: "rs_sync_desde",
  syncUlt: "rs_sync_ultima", syncErr: "rs_sync_error",
};
const app = document.getElementById("app");

// ---------- Almacenamiento ----------
function leer(clave, defecto) {
  try { const v = localStorage.getItem(clave); return v === null ? defecto : JSON.parse(v); }
  catch (e) { return defecto; }
}
function escribir(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); return true; }
  catch (e) { toast("⚠ No se pudo guardar en el teléfono. Exporta tus datos."); return false; }
}
let registros = leer(K.reg, {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

const agregarA = (clave, ids) => { const s = new Set(leer(clave, [])); ids.forEach(i => s.add(i)); escribir(clave, [...s]); };
// Guarda y marca los trackers como pendientes de exportar y de enviar a la oficina
function guardarRegistros(ids = []) {
  escribir(K.reg, registros);
  agregarA(K.cambios, ids);
  agregarA(K.sync, ids);
  pintarBadge(); pintarNube();
  if (ids.length) programarSync();
}
function nCambios() { const c = leer(K.cambios, []); return Array.isArray(c) ? c.length : 0; }

// ---------- Utilidades ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const limpio = s => String(s ?? "").trim().toUpperCase();
const ahora = () => new Date().toLocaleString("sv-SE").slice(0, 16);
const clonar = o => o == null ? null : JSON.parse(JSON.stringify(o));
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("ver");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("ver"), 2600);
}
function tecnico() { return leer(K.tec, ""); }
function nStrings(id) { return registros[id]?.n || window.STRINGS_DEFECTO[id] || 4; }
const existeTracker = id => { const [sc, t] = String(id).split("."); return !!window.TRACKERS[sc]?.includes(t); };

const pad = n => String(n).padStart(2, "0");
const fmtInv = n => "INV " + pad(n);
const fmtPV = n => "PV" + n;
const aNum = v => { const n = parseInt(String(v ?? "").replace(/\D/g, ""), 10); return Number.isFinite(n) ? n : ""; };
const numTr = t => parseInt(String(t).replace(/\D/g, ""), 10);
const prefTr = t => String(t).replace(/\d+$/, "");
const fmtTr = (n, pref = "MQR") => pref + String(n).padStart(3, "0");
const nomTr = id => id.split(".")[1];

// ---------- Modelo de datos ----------
// Por string: mTr/mInv/mStr = lo que dice la marquilla del cable; inv/ent = inversor y PV donde está conectado.
// Cada campo guarda en r.ts la hora (ISO) de su último cambio, para unir datos de varios técnicos campo por campo.
const CAMPOS = ["mTr", "mInv", "mStr", "inv", "ent"];
const TXT_CAMPO = { mTr: "marquilla tracker", mInv: "marquilla inversor", mStr: "marquilla string", inv: "inversor", ent: "PV" };
const CLAVES = ["n", "obs"];
for (let i = 0; i < 4; i++) for (const c of CAMPOS) CLAVES.push(i + "." + c);

function leerCampo(r, k) {
  if (!r) return "";
  if (k === "n") return r.n || "";
  if (k === "obs") return r.obs || "";
  const [i, c] = k.split(".");
  return r.s?.[+i]?.[c] ?? "";
}
function escribirCampo(r, k, v) {
  if (k === "n") r.n = v;
  else if (k === "obs") r.obs = v;
  else {
    const [i, c] = k.split(".");
    r.s ||= [];
    for (let j = 0; j <= +i; j++) r.s[j] ||= {};
    r.s[+i][c] = v;
  }
}
const valoresDe = r => Object.fromEntries(CLAVES.map(k => [k, leerCampo(r, k)]));
function txtValor(k, v) {
  if (v === "" || v == null) return "—";
  const c = k.split(".")[1];
  if (c === "mTr") return fmtTr(v);
  if (c === "mInv" || c === "inv") return fmtInv(v);
  if (c === "mStr") return "S" + v;
  if (c === "ent") return fmtPV(v);
  return String(v);
}
const txtClave = k => k === "n" ? "Nº strings" : k === "obs" ? "Observaciones" : `S${+k.split(".")[0] + 1} ${TXT_CAMPO[k.split(".")[1]]}`;

// Cambia campos de un tracker ({"n": 2, "0.mInv": 3, ...}); solo marca hora en los que cambian.
// Devuelve {id, antes} si hubo cambios. Usar siempre dentro de transaccion().
function aplicar(id, cambios) {
  const antes = clonar(registros[id] || null);
  const r = registros[id] ||= { n: nStrings(id), s: [], obs: "", ts: {} };
  r.ts ||= {};
  const t = new Date().toISOString();
  let hubo = false;
  for (const [k, v] of Object.entries(cambios)) {
    if (leerCampo(r, k) === v) continue;
    escribirCampo(r, k, v); r.ts[k] = t; hubo = true;
  }
  if (!hubo) { if (!antes) delete registros[id]; return null; }
  r.tec = tecnico(); r.fecha = ahora();
  return { id, antes };
}

// Agrupa cambios en una entrada del historial, guarda y programa el envío
function transaccion(meta, fn) {
  const res = fn().filter(Boolean);
  if (!res.length) return null;
  const porId = new Map();
  for (const c of res) if (!porId.has(c.id)) porId.set(c.id, c.antes);
  const ids = [...porId.keys()];
  guardarRegistros(ids);
  const entrada = registrarHistorial(meta, porId);
  if (meta.snack) mostrarDeshacer(entrada);
  return entrada;
}

// Un tracker sin ningún dato cuenta como pendiente (ej. después de borrar o deshacer)
const tieneDatos = r => !!r && (!!r.obs || (r.s || []).some(s => s && CAMPOS.some(c => s[c])));
const levantado = s => !!(s && s.mTr && s.mInv && s.mStr);
const conectado = s => !!(s && s.inv && s.ent);

function avance(id) {
  const r = registros[id], n = nStrings(id); let lev = 0, con = 0;
  for (let i = 0; i < n; i++) { const s = r?.s?.[i]; if (levantado(s)) lev++; if (conectado(s)) con++; }
  return { n, lev, con };
}
function estado(id) {
  if (!tieneDatos(registros[id])) return "pendiente";
  const a = avance(id);
  return a.lev === a.n && a.con === a.n ? "completo" : "parcial";
}
const TXT_ESTADO = { completo: "Completo", parcial: "Incompleto", pendiente: "Pendiente" };

function resumenSC(sc) {
  const ts = window.TRACKERS[sc]; let c = 0, p = 0;
  for (const t of ts) { const e = estado(sc + "." + t); if (e === "completo") c++; else if (e === "parcial") p++; }
  return { total: ts.length, c, p };
}

// Ocupación de un subcampo: "inv|pv" -> lista de {id, i} (tracker y string conectados ahí)
function ocupacion(sc) {
  const m = {};
  for (const [id, r] of Object.entries(registros)) {
    if (!id.startsWith(sc + ".")) continue;
    for (let i = 0; i < (r.n || 4); i++) {
      const s = r.s?.[i];
      if (conectado(s)) (m[s.inv + "|" + s.ent] ||= []).push({ id, i });
    }
  }
  return m;
}

// Marquillas del subcampo: "mInv|mStr" -> lista de {id, i} que la tienen anotada
function marquillas(sc) {
  const m = {};
  for (const [id, r] of Object.entries(registros)) {
    if (!id.startsWith(sc + ".")) continue;
    for (let i = 0; i < (r.n || 4); i++) {
      const s = r.s?.[i];
      if (s && s.mInv && s.mStr) (m[s.mInv + "|" + s.mStr] ||= []).push({ id, i });
    }
  }
  return m;
}

// Diferencias encontradas en un tracker
function novedades(id, ocup, marq) {
  const r = registros[id]; if (!tieneDatos(r)) return [];
  const [sc, t] = id.split("."), real = numTr(t), out = [];
  ocup ||= ocupacion(sc); marq ||= marquillas(sc);
  for (let i = 0; i < (r.n || 4); i++) {
    const s = r.s?.[i]; if (!s) continue;
    const S = "S" + (i + 1);
    if (s.mTr && s.mTr !== real) out.push({ i, txt: `${S}: la marquilla dice tracker ${fmtTr(s.mTr, prefTr(t))}` });
    if (s.mInv && s.inv && s.mInv !== s.inv) out.push({ i, txt: `${S}: la marquilla dice ${fmtInv(s.mInv)} pero está conectado en ${fmtInv(s.inv)}` });
    if (conectado(s) && !PV_HABITUALES.has(s.ent)) out.push({ i, txt: `${S}: conectado en ${fmtInv(s.inv)} ${fmtPV(s.ent)}, que normalmente va vacío` });
    if (s.mInv && s.mStr && (marq[s.mInv + "|" + s.mStr] || []).length > 1) out.push({ i, txt: `${S}: marquilla ${fmtInv(s.mInv)} string ${s.mStr} repetida en otro string del subcampo` });
    if (conectado(s) && (ocup[s.inv + "|" + s.ent] || []).length > 1) out.push({ i, txt: `${S}: ${fmtInv(s.inv)} ${fmtPV(s.ent)} tiene más de un string` });
  }
  return out;
}
function novedadesSC(sc) {
  const ocup = ocupacion(sc), marq = marquillas(sc);
  return window.TRACKERS[sc].reduce((a, t) => a + novedades(sc + "." + t, ocup, marq).length, 0);
}

// Une dos versiones del mismo tracker: por cada campo gana el cambio más reciente (incluye datos borrados)
function fusionar(a, b) {
  const out = { n: a.n || b.n || 4, s: [], obs: "", ts: {} }, dif = [];
  let maxA = "", maxB = "";
  for (const k of CLAVES) {
    const ta = a.ts?.[k] || "", tb = b.ts?.[k] || "", va = leerCampo(a, k), vb = leerCampo(b, k);
    // Sin horas (datos antiguos o CSV) solo se rellenan campos vacíos
    const usarB = tb > ta || (!ta && !tb && va === "" && vb !== "");
    escribirCampo(out, k, usarB ? vb : va);
    const t = usarB ? tb : ta;
    if (t) out.ts[k] = t;
    if (ta > maxA) maxA = ta;
    if (tb > maxB) maxB = tb;
    if (va !== "" && vb !== "" && va !== vb) dif.push(txtClave(k));
  }
  const rec = maxB > maxA || (!maxA && !maxB && (b.fecha || "") > (a.fecha || "")) ? b : a;
  out.tec = rec.tec || a.tec || b.tec || ""; out.fecha = rec.fecha || a.fecha || b.fecha || "";
  return [out, dif, rec];
}

// ---------- Historial y deshacer ----------
const MAX_HIST = 300;
function registrarHistorial(meta, porId) {
  const hist = leer(K.hist, []);
  const cambios = [...porId].map(([id, antes]) => ({ id, antes, despues: clonar(registros[id] || null) }));
  const ultimo = hist[hist.length - 1];
  // Las ediciones seguidas de la misma ficha se agrupan en una sola entrada
  if (ultimo && meta.tipo.startsWith("ficha:") && ultimo.tipo === meta.tipo && ultimo.tec === tecnico() &&
      !ultimo.deshecho && Date.now() - Date.parse(ultimo.t) < 120000) {
    ultimo.cambios[0].despues = cambios[0].despues;
    ultimo.t = new Date().toISOString(); ultimo.f = ahora();
    escribir(K.hist, hist);
    return ultimo;
  }
  const entrada = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 6), t: new Date().toISOString(), f: ahora(), tec: tecnico(), tipo: meta.tipo, desc: meta.desc, cambios };
  hist.push(entrada);
  escribir(K.hist, hist.slice(-MAX_HIST));
  return entrada;
}
function diferencias(antes, despues) {
  const a = valoresDe(antes), d = valoresDe(despues);
  return CLAVES.filter(k => a[k] !== d[k] && !(k === "n" && (!a[k] || !d[k])))
    .map(k => `${txtClave(k)}: ${txtValor(k, a[k])} → ${txtValor(k, d[k])}`);
}
function deshacer(entradaId) {
  const hist = leer(K.hist, []), e = hist.find(x => x.id === entradaId);
  if (!e || e.deshecho) return toast("Ese cambio ya se deshizo");
  const posteriores = e.cambios.some(c => JSON.stringify(valoresDe(registros[c.id])) !== JSON.stringify(valoresDe(c.despues)));
  if (posteriores && !confirm("Hubo cambios después de este en los mismos trackers. ¿Deshacer igual?")) return;
  e.deshecho = true;
  escribir(K.hist, hist);
  transaccion({ tipo: "deshacer", desc: "Deshacer: " + e.desc }, () => e.cambios.map(c => aplicar(c.id, valoresDe(c.antes))));
  toast("Cambio deshecho");
  refrescar();
}
let snackTimer;
function mostrarDeshacer(entrada) {
  const sn = document.getElementById("snack");
  document.getElementById("snackTxt").textContent = entrada.desc;
  document.getElementById("snackBtn").onclick = () => { sn.classList.remove("ver"); deshacer(entrada.id); };
  sn.classList.add("ver");
  clearTimeout(snackTimer); snackTimer = setTimeout(() => sn.classList.remove("ver"), 7000);
}

// ---------- Envío a la oficina (Google Sheets) ----------
let sincronizando = false, syncTimer = null;
function programarSync() {
  if (!leer(K.syncUrl, "")) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => sincronizar(false), 4000);
}
async function sincronizar(manual) {
  const url = leer(K.syncUrl, "");
  if (!url || sincronizando) return false;
  if (!navigator.onLine) { if (manual) toast("Sin señal: se enviará cuando haya internet"); return false; }
  sincronizando = true; pintarNube();
  try {
    const pend = leer(K.sync, []), lote = {};
    for (const id of pend) if (registros[id]) lote[id] = clonar(registros[id]);
    const resp = await fetch(url, {
      method: "POST",
      body: JSON.stringify({ accion: "sync", clave: leer(K.syncClave, ""), tecnico: tecnico(), version: VERSION, desde: leer(K.syncDesde, 0), registros: lote }),
    });
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || "respuesta inválida");
    // Quita de pendientes lo enviado que no cambió mientras se enviaba
    const quedan = new Set(leer(K.sync, []));
    for (const id of pend) if (JSON.stringify(registros[id] || null) === JSON.stringify(lote[id] || null)) quedan.delete(id);
    // Une lo que registraron los otros técnicos
    let recibidos = 0;
    for (const [id, rec] of Object.entries(j.registros || {})) {
      if (!existeTracker(id) || !rec) continue;
      const local = registros[id], unido = local ? fusionar(local, rec)[0] : rec;
      if (JSON.stringify(unido) !== JSON.stringify(local)) { registros[id] = unido; recibidos++; }
    }
    escribir(K.reg, registros);
    escribir(K.sync, [...quedan]);
    escribir(K.syncDesde, j.ahora || 0);
    escribir(K.syncUlt, ahora());
    escribir(K.syncErr, "");
    if (manual) toast(`Enviado a la oficina${recibidos ? ` · ${recibidos} tracker(s) actualizados de otros técnicos` : ""}`);
    if (recibidos) refrescarSiQuieto();
    return true;
  } catch (e) {
    escribir(K.syncErr, `${ahora()}: ${e.message}`);
    if (manual) toast("No se pudo enviar: " + e.message);
    return false;
  } finally {
    sincronizando = false; pintarNube();
  }
}
function pintarNube() {
  const b = document.getElementById("btnNube");
  if (!leer(K.syncUrl, "")) return b.classList.add("oculto");
  const n = leer(K.sync, []).length, err = leer(K.syncErr, "");
  b.classList.remove("oculto");
  b.classList.toggle("error", !!err && n > 0);
  b.textContent = sincronizando ? "☁ …" : n ? `☁ ${n}` : "☁ ✓";
  b.title = n ? `${n} tracker(s) por enviar a la oficina` : "Todo enviado a la oficina";
}
window.addEventListener("online", () => sincronizar(false));

function enrutar(mantenerScroll) {
  if (!mantenerScroll) window.scrollTo(0, 0);
  if (!tecnico()) return vistaTecnico();
  const h = decodeURIComponent(location.hash.slice(1) || "/");
  let m;
  if ((m = h.match(/^\/sc\/(.+)$/)) && window.TRACKERS[m[1]]) return vistaSubcampo(m[1]);
  if ((m = h.match(/^\/t\/([^.]+)\.(.+)$/)) && window.TRACKERS[m[1]]?.includes(m[2])) return vistaFicha(m[1], m[2]);
  if ((m = h.match(/^\/inv\/([^/]+)\/(\d+)$/)) && window.TRACKERS[m[1]] && +m[2] >= 1 && +m[2] <= INVERSORES) return vistaInversor(m[1], +m[2]);
  if ((m = h.match(/^\/inv\/([^/]+)$/)) && window.TRACKERS[m[1]]) return vistaInversores(m[1]);
  if ((m = h.match(/^\/resumen\/(.+)$/)) && window.TRACKERS[m[1]]) return vistaResumen(m[1]);
  if ((m = h.match(/^\/historial(?:\/(.+))?$/))) return vistaHistorial(m[1] && existeTracker(m[1]) ? m[1] : null);
  if (h === "/exportar") return vistaExportar();
  if (h === "/ajustes") return vistaAjustes();
  return vistaInicio();
}

    }
    strs.innerHTML = html;
    strs.querySelectorAll("input, select").forEach(el => el.addEventListener("change", () => {
      // El inversor de S1 se copia a los strings que aún no lo tienen
      if (el.classList.contains("mInv") && el.closest(".str").dataset.i === "0")
        strs.querySelectorAll(".mInv").forEach(o => { if (!o.value) o.value = el.value; });
      guardar();
    }));
    validar();
  }

  function validar() {
    const ocup = ocupacion(sc), marq = marquillas(sc);
    strs.querySelectorAll(".str").forEach(div => {
      const i = +div.dataset.i, s = registros[id]?.s?.[i] || {}, msgs = [];
      const mTr = aNum(div.querySelector(".mTr").value), mInv = aNum(div.querySelector(".mInv").value), mStr = aNum(div.querySelector(".mStr").value);
      if (mTr && mTr !== real) msgs.push(`<span class="warn">⚠ La marquilla es de otro tracker: ${fmtTr(mTr, pref)}</span>`);
      const rep = (marq[mInv + "|" + mStr] || []).filter(u => !(u.id === id && u.i === i));
      if (mInv && mStr && rep.length) msgs.push(`<span class="warn">⚠ ${fmtInv(mInv)} S${mStr} ya está anotada en ${rep.map(u => `${nomTr(u.id)} S${u.i + 1}`).join(", ")}</span>`);
      if (conectado(s)) {
        msgs.push(`<span class="ok">Conectado en ${fmtInv(s.inv)} · ${fmtPV(s.ent)}</span>`);
        if (mInv && mInv !== s.inv) msgs.push(`<span class="err">⚠ La marquilla dice ${fmtInv(mInv)}</span>`);
        if (!PV_HABITUALES.has(s.ent)) msgs.push(`<span class="err">⚠ ${fmtPV(s.ent)} normalmente va vacío</span>`);
        if ((ocup[s.inv + "|" + s.ent] || []).length > 1) msgs.push(`<span class="err">⚠ Ese PV tiene otro string</span>`);
      } else msgs.push(`<span class="muted">Falta asociar en el inversor</span>`);
      div.querySelector(".info").innerHTML = msgs.join("<br>");
    });
    const e = estado(id), el = document.getElementById("estado");
    el.textContent = TXT_ESTADO[e]; el.className = "estado st-" + e;
    const inv1 = aNum(strs.querySelector(".mInv")?.value);
    const ir = document.getElementById("irInv");
    ir.href = inv1 ? `#/inv/${sc}/${inv1}` : `#/inv/${sc}`;
    ir.textContent = inv1 ? `Ir al ${fmtInv(inv1)} (asociar PV)` : "Ir a los inversores";
    document.getElementById("borrar").style.display = tieneDatos(registros[id]) ? "" : "none";
  }

  function guardar() {
    const c = { n, obs: document.getElementById("obs").value.trim() };
    leerForm().forEach((f, i) => { c[i + ".mTr"] = f.mTr; c[i + ".mInv"] = f.mInv; c[i + ".mStr"] = f.mStr; });
    transaccion({ tipo: "ficha:" + id, desc: `Marquillas ${t}` }, () => [aplicar(id, c)]);
    if (registros[id]?.fecha) document.getElementById("guardado").textContent = `Guardado ${registros[id].fecha} · ${registros[id].tec}`;
    validar();
  }

  document.querySelectorAll("#segm button").forEach(b => b.onclick = () => {
    const form = leerForm(); n = +b.dataset.n; pintarStrings(form); guardar();
  });
  document.getElementById("obs").addEventListener("input", guardar);
  document.getElementById("ant").onclick = () => { location.replace(`#/t/${sc}.${lista[idx - 1]}`); };
  document.getElementById("sig").onclick = () => {
    const a = avance(id);
    if (a.lev < a.n && !confirm("Faltan marquillas por anotar en este tracker. ¿Pasar al siguiente de todas formas?")) return;
    location.replace(`#/t/${sc}.${lista[idx + 1]}`);
  };
  document.getElementById("borrar").onclick = () => {
    if (!confirm(`¿Borrar los datos registrados de ${id}? (se puede deshacer)`)) return;
    const vacio = Object.fromEntries(CLAVES.filter(k => k !== "n").map(k => [k, ""]));
    transaccion({ tipo: "borrar", desc: `Borrado ${t}`, snack: true }, () => [aplicar(id, vacio)]);
    vistaFicha(sc, t);
  };
  pintarStrings();
}

// Paso 2, en el inversor: lista de los inversores del subcampo
function vistaInversores(sc) {
  cabecera("Inversores " + sc, "#/sc/" + sc);
  const ocup = ocupacion(sc), esperados = {};
  for (const t of window.TRACKERS[sc]) {
    const r = registros[sc + "." + t]; if (!r) continue;
    for (let i = 0; i < (r.n || 4); i++) { const s = r.s?.[i]; if (levantado(s)) esperados[s.mInv] = (esperados[s.mInv] || 0) + 1; }
  }
  let total = 0;
  const filas = Array.from({ length: INVERSORES }, (_, k) => k + 1).map(inv => {
    const e = estadoInversor(ocup, inv);
    total += e.usadas;
    const alertas = [e.dup && `${e.dup} PV con dos strings`, e.fuera && `${e.fuera} en PV que normalmente va vacío`].filter(Boolean);
    return `<a class="sc" href="#/inv/${esc(sc)}/${inv}">
      <div class="top"><span>${fmtInv(inv)}</span><span class="muted">${e.usadas}/${PV_HABITUALES.size} PV</span></div>
      <div class="barra"><i class="c" style="width:${e.usadas / PV_HABITUALES.size * 100}%"></i></div>
      <div class="muted" style="margin-top:6px">${esperados[inv] || 0} strings con marquilla de este inversor${alertas.length ? ` · <span class="err">${alertas.join(" · ")}</span>` : ""}</div>
    </a>`;
  }).join("");
  app.innerHTML = `
    <div class="card"><div class="stat"><span>PV asociados en el subcampo</span><b>${total} / ${INVERSORES * PV_HABITUALES.size}</b></div></div>
    <div class="lista-sc">${filas}</div>`;
}
function estadoInversor(ocup, inv) {
  let usadas = 0, dup = 0, fuera = 0;
  for (let e = 1; e <= PV_TOTAL; e++) {
    const u = ocup[inv + "|" + e] || [];
    if (u.length) PV_HABITUALES.has(e) ? usadas++ : fuera++;
    if (u.length > 1) dup++;
  }
  return { usadas, dup, fuera };
}

// Cómo se lee un string en las listas: como su marquilla; si es de otro tracker se indica el real
function etiquetaString({ s, t, i }) {
  return levantado(s) ? `${fmtTr(s.mTr, prefTr(t))} · S${s.mStr} · ${fmtInv(s.mInv)}` : `${t} S${i + 1} (sin marquilla anotada)`;
}

// Conecta un string a un PV (o lo deja libre). Devuelve false si el técnico cancela.
function asignarPV(sc, inv, pv, destino) {
  if (destino) {
    const s = registros[destino.id]?.s?.[destino.i];
    if (conectado(s) && !(s.inv === inv && s.ent === pv) &&
        !confirm(`Ese string ya está en ${fmtInv(s.inv)} ${fmtPV(s.ent)}. ¿Moverlo a ${fmtInv(inv)} ${fmtPV(pv)}?`)) return false;
  }
  const desc = destino ? `${fmtInv(inv)} ${fmtPV(pv)} ← ${nomTr(destino.id)} S${destino.i + 1}` : `${fmtInv(inv)} ${fmtPV(pv)} liberado`;
  transaccion({ tipo: "pv", desc, snack: true }, () => {
    const res = [];
    for (const u of ocupacion(sc)[inv + "|" + pv] || [])
      if (!destino || u.id !== destino.id || u.i !== destino.i) res.push(aplicar(u.id, { [u.i + ".inv"]: "", [u.i + ".ent"]: "" }));
    if (destino) res.push(aplicar(destino.id, { [destino.i + ".inv"]: inv, [destino.i + ".ent"]: pv }));
    return res;
  });
  return true;
}

// Paso 2, en el inversor: a cada PV se le asigna el string cuyo cable llega ahí
function vistaInversor(sc, inv) {
  escribir(K.ultSc, sc); escribir(K.ultInv, inv);
  cabecera(`${fmtInv(inv)} · ${sc}`, "#/inv/" + sc);
  const ocup = ocupacion(sc);
  let filas = "";
  for (const [m, desde, hasta] of MPPT_RANGOS) {
    filas += `<h2 class="mppt">MPPT${m}</h2>`;
    for (let pv = desde; pv <= hasta; pv++) {
      const hab = PV_HABITUALES.has(pv), u = ocup[inv + "|" + pv] || [], msgs = [];
      let txt = "— libre · toca para asignar —";
      if (u[0]) {
        const s = registros[u[0].id].s[u[0].i], t = nomTr(u[0].id);
        txt = etiquetaString({ s, t, i: u[0].i });
        if (!hab) msgs.push(`<span class="err">⚠ Novedad: este PV normalmente va vacío</span>`);
        if (u.length > 1) msgs.push(`<span class="err">⚠ Hay ${u.length} strings en este PV: ${u.map(x => `${esc(nomTr(x.id))} S${x.i + 1}`).join(", ")}</span>`);
        msgs.push(`Tracker real: <a href="#/t/${esc(u[0].id)}">${esc(t)} S${u[0].i + 1}</a>`);
        if (s.mInv && s.mInv !== inv) msgs.push(`<span class="err">⚠ La marquilla dice ${fmtInv(s.mInv)}</span>`);
        if (s.mTr && s.mTr !== numTr(t)) msgs.push(`<span class="warn">⚠ Marquilla de ${fmtTr(s.mTr, prefTr(t))}</span>`);
      }
      filas += `<div class="pv ${hab ? "" : "vacio"}" id="pv${pv}"><div class="n">${fmtPV(pv)}${hab ? "" : "<small>vacío</small>"}</div>
        <div><button class="pv-btn ${u[0] ? "" : "libre"}" data-pv="${pv}">${esc(txt)}</button><div class="info">${msgs.join(" · ")}</div></div></div>`;
    }
  }
  const celda = pv => {
    if (pv === null) return `<i class="sep"></i>`;
    const u = ocup[inv + "|" + pv] || [], hab = PV_HABITUALES.has(pv);
    const cls = u.length > 1 || (u.length && !hab) ? "c-err" : u.length ? "c-ok" : hab ? "c-falta" : "c-vacio";
    return `<button class="${cls}" data-pv="${pv}" aria-label="${fmtPV(pv)}">${pv}</button>`;
  };
  const panel = PANEL.map(lado => `<div class="panel">${lado.arriba.map(celda).join("")}${lado.abajo.map(celda).join("")}</div>`).join("");
  const e = estadoInversor(ocup, inv);
  app.innerHTML = `
    <div class="card">
      <div class="stat"><span>PV habituales conectados</span><b>${e.usadas} / ${PV_HABITUALES.size}</b></div>
      ${panel}
      <p class="muted"><span class="c-ok">●</span> conectado <span class="c-falta">●</span> falta <span class="c-err">●</span> novedad <span class="c-vacio">●</span> normalmente vacío</p>
      <p class="muted">Toca un PV, escribe el número de tracker y de string de la marquilla (ej. <b>85 5</b>) y elige el string. Pasa solo al siguiente PV libre.</p>
    </div>
    <div class="card">${filas}</div>
    <div class="nav-t">
      <button class="btn sec" id="ant" ${inv === 1 ? "disabled" : ""}>‹ ${inv > 1 ? fmtInv(inv - 1) : ""}</button>
      <button class="btn" id="sig" ${inv === INVERSORES ? "disabled" : ""}>${inv < INVERSORES ? fmtInv(inv + 1) : ""} ›</button>
    </div>`;
  app.querySelectorAll("[data-pv]").forEach(b => b.onclick = () => abrirBuscador(sc, inv, +b.dataset.pv));
  document.getElementById("ant").onclick = () => location.replace(`#/inv/${sc}/${inv - 1}`);
  document.getElementById("sig").onclick = () => location.replace(`#/inv/${sc}/${inv + 1}`);
}

// ---------- Buscador de strings para un PV ----------
// Busca por la marquilla: "85" = tracker 85, "85 5" = tracker 85 string 5. Sin texto: los que dicen este inversor y faltan.
function buscarStrings(sc, inv, q) {
  const nums = (q.match(/\d+/g) || []).map(Number), out = [];
  for (const t of window.TRACKERS[sc]) {
    const id = sc + "." + t, real = numTr(t), n = nStrings(id);
    for (let i = 0; i < n; i++) {
      const s = registros[id]?.s?.[i] || {};
      if (!nums.length) { if (!(levantado(s) && s.mInv === inv && !conectado(s))) continue; }
      else {
        if (s.mTr !== nums[0] && real !== nums[0]) continue;
        if (nums[1] && s.mStr !== nums[1] && !(!s.mStr && i + 1 === nums[1])) continue;
      }
      out.push({ id, t, i, s });
    }
  }
  const peso = x => (x.s.mInv === inv ? 0 : 2) + (conectado(x.s) ? 1 : 0);
  out.sort((a, b) => peso(a) - peso(b) || (a.s.mStr || 99) - (b.s.mStr || 99) || numTr(a.t) - numTr(b.t) || a.i - b.i);
  return out.slice(0, 40);
}

const hoja = document.getElementById("hoja");
function cerrarBuscador() { hoja.classList.remove("ver"); hoja.innerHTML = ""; }
hoja.addEventListener("click", e => { if (e.target === hoja) cerrarBuscador(); });

function abrirBuscador(sc, inv, pv) {
  const hab = PV_HABITUALES.has(pv), actual = (ocupacion(sc)[inv + "|" + pv] || [])[0];
  hoja.innerHTML = `<div class="hoja-panel">
    <div class="hoja-top"><b>${fmtInv(inv)} · ${fmtPV(pv)}</b><button id="hCerrar" aria-label="Cerrar">✕</button></div>
    ${hab ? "" : `<p class="err" style="margin-top:0">⚠ Este PV normalmente va vacío. Si tiene un cable, quedará como novedad.</p>`}
    ${actual ? `<p class="muted" style="margin-top:0">Ahora: <b>${esc(etiquetaString({ s: registros[actual.id].s[actual.i], t: nomTr(actual.id), i: actual.i }))}</b></p>` : ""}
    <label for="hQ">Marquilla del cable: tracker y string</label>
    <input id="hQ" inputmode="tel" autocomplete="off" placeholder="Ej. 85 5">
    <label class="check"><input type="checkbox" id="hAuto" ${leer(K.auto, true) ? "checked" : ""}>Pasar solo al siguiente PV libre</label>
    <div id="hRes"></div>
    ${actual ? `<button class="btn peligro" id="hLibre">Dejar ${fmtPV(pv)} libre</button>` : ""}
  </div>`;
  hoja.classList.add("ver");
  const q = document.getElementById("hQ"), res = document.getElementById("hRes");
  let lista = [];
  function pintar() {
    lista = buscarStrings(sc, inv, q.value);
    const vacio = !q.value.trim();
    res.innerHTML = (vacio ? `<p class="muted">Strings con marquilla ${fmtInv(inv)} que faltan por conectar:</p>` : "") +
      (lista.length ? lista.map((x, k) => {
        const notas = [];
        if (levantado(x.s) && x.s.mTr !== numTr(x.t)) notas.push(`<span class="warn">Tracker real ${esc(x.t)} S${x.i + 1}</span>`);
        else notas.push(`Tracker real ${esc(x.t)} S${x.i + 1}`);
        if (x.s.mInv && x.s.mInv !== inv) notas.push(`<span class="err">marquilla de ${fmtInv(x.s.mInv)}</span>`);
        if (conectado(x.s)) notas.push(`ya en ${fmtInv(x.s.inv)} ${fmtPV(x.s.ent)}`);
        return `<button class="res ${x.s.mInv === inv ? "propio" : ""}" data-k="${k}"><b>${esc(etiquetaString(x))}</b><small>${notas.join(" · ")}</small></button>`;
      }).join("") : `<p class="muted">${vacio ? "No hay pendientes con esa marquilla. Escribe el número de tracker." : "Sin resultados para esa marquilla."}</p>`);
    res.querySelectorAll(".res").forEach(b => b.onclick = () => elegir(lista[+b.dataset.k]));
  }
  function elegir(x) {
    if (!asignarPV(sc, inv, pv, x ? { id: x.id, i: x.i } : null)) return;
    const auto = document.getElementById("hAuto").checked;
    escribir(K.auto, auto);
    refrescar();
    if (!x || !auto) return cerrarBuscador();
    // Siguiente PV habitual sin cable, en orden
    const ocup = ocupacion(sc), orden = [...PV_HABITUALES].sort((a, b) => a - b);
    const sig = [...orden.filter(p => p > pv), ...orden.filter(p => p < pv)].find(p => !(ocup[inv + "|" + p] || []).length);
    if (!sig) { cerrarBuscador(); return toast(`${fmtInv(inv)}: todos los PV habituales tienen string`); }
    document.getElementById("pv" + sig)?.scrollIntoView({ block: "center" });
    abrirBuscador(sc, inv, sig);
  }
  q.addEventListener("input", pintar);
  q.addEventListener("keydown", e => { if (e.key === "Enter" && lista.length) elegir(lista[0]); });
  document.getElementById("hAuto").onchange = e => escribir(K.auto, e.target.checked);
  document.getElementById("hCerrar").onclick = cerrarBuscador;
  if (actual) document.getElementById("hLibre").onclick = () => elegir(null);
  pintar();
  q.focus();
}

// ---------- Resumen por subcampo ----------
function vistaResumen(sc) {
  cabecera("Resumen " + sc, "#/sc/" + sc);
  const ocup = ocupacion(sc), marq = marquillas(sc), esperados = {};
  let nS = 0, lev = 0, con = 0;
  const cuenta = { completo: 0, parcial: 0, pendiente: 0 }, novs = [], pend = [];
  for (const t of window.TRACKERS[sc]) {
    const id = sc + "." + t, a = avance(id), e = estado(id);
    nS += a.n; lev += a.lev; con += a.con; cuenta[e]++;
    if (e !== "completo") pend.push({ id, t, a, e });
    for (const nv of novedades(id, ocup, marq)) novs.push({ id, t, ...nv });
    const r = registros[id];
    for (let i = 0; i < (r?.n || 0); i++) { const s = r.s?.[i]; if (levantado(s)) esperados[s.mInv] = (esperados[s.mInv] || 0) + 1; }
  }
  const total = window.TRACKERS[sc].length;
  const filasInv = Array.from({ length: INVERSORES }, (_, k) => k + 1).map(inv => {
    const e = estadoInversor(ocup, inv);
    return `<tr><td><a href="#/inv/${esc(sc)}/${inv}">${fmtInv(inv)}</a></td><td>${e.usadas}/${PV_HABITUALES.size}</td>
      <td>${esperados[inv] || 0}</td><td class="${e.fuera ? "err" : ""}">${e.fuera}</td><td class="${e.dup ? "err" : ""}">${e.dup}</td></tr>`;
  }).join("");
  app.innerHTML = `
    <div class="card">
      <h2>Subcampo ${esc(sc)}</h2>
      <p class="muted" style="margin-top:-6px">Generado ${esc(ahora())} por ${esc(tecnico())}${leer(K.syncUlt, "") ? ` · última sincronización ${esc(leer(K.syncUlt, ""))}` : ""}</p>
      <div class="stat"><span>Trackers completos</span><b>${cuenta.completo} / ${total}</b></div>
      <div class="stat"><span>Trackers incompletos</span><b>${cuenta.parcial}</b></div>
      <div class="stat"><span>Trackers sin visitar</span><b>${cuenta.pendiente}</b></div>
      <div class="stat"><span>Strings con marquilla anotada</span><b>${lev} / ${nS}</b></div>
      <div class="stat"><span>Strings asociados en inversor</span><b>${con} / ${nS}</b></div>
      <div class="stat"><span>Novedades</span><b class="${novs.length ? "err" : ""}">${novs.length}</b></div>
      <button class="btn no-imprimir" id="imprimir">Imprimir / guardar PDF</button>
    </div>
    <div class="card">
      <h2>Avance por inversor</h2>
      <table class="tabla"><thead><tr><th>Inversor</th><th>PV conectados</th><th>Marquillas</th><th>PV no habitual</th><th>PV doble</th></tr></thead>
      <tbody>${filasInv}</tbody></table>
      <p class="muted">Marquillas = strings cuya marquilla dice ese inversor.</p>
    </div>
    <div class="card">
      <h2>Novedades (${novs.length})</h2>
      ${novs.length ? `<ul class="lista-nov">${novs.map(x => `<li><a href="#/t/${esc(x.id)}">${esc(x.t)}</a> ${esc(x.txt)}</li>`).join("")}</ul>` : `<p class="muted">Sin novedades.</p>`}
    </div>
    <div class="card">
      <h2>Trackers por terminar (${pend.length})</h2>
      ${pend.length ? `<ul class="lista-nov">${pend.map(x => `<li><a href="#/t/${esc(x.id)}">${esc(x.t)}</a> · ${TXT_ESTADO[x.e]} · marquillas ${x.a.lev}/${x.a.n} · inversor ${x.a.con}/${x.a.n}</li>`).join("")}</ul>` : `<p class="muted">Todos completos.</p>`}
    </div>`;
  document.getElementById("imprimir").onclick = () => window.print();
}

// ---------- Exportar / importar ----------
const COLS = ["Subcampo", "Tracker real", "Nombre completo", "Nº strings", "String", "Marquilla tracker", "Marquilla inversor", "Marquilla string",
  "Inversor conectado", "PV", "Marquilla = tracker", "Marquilla = inversor", "PV habitual", "Estado", "Observaciones", "Técnico", "Fecha"];
const ANCHOS = [10, 11, 16, 10, 7, 15, 16, 14, 16, 7, 17, 18, 13, 11, 24, 16, 17];
function filasExport() {
  const filas = [];
  for (const sc of Object.keys(window.TRACKERS)) for (const t of window.TRACKERS[sc]) {
    const id = sc + "." + t, r = registros[id];
    if (!tieneDatos(r)) continue;
    const n = r.n || 4, e = TXT_ESTADO[estado(id)], real = numTr(t);
    for (let i = 0; i < n; i++) {
      const s = r.s?.[i] || {};
      filas.push([sc, t, id, n, "S" + (i + 1),
        s.mTr ? fmtTr(s.mTr, prefTr(t)) : "", s.mInv || "", s.mStr ? "S" + s.mStr : "",
        s.inv || "", s.ent ? fmtPV(s.ent) : "",
        s.mTr ? (s.mTr === real ? "Sí" : "No") : "", s.mInv && s.inv ? (s.mInv === s.inv ? "Sí" : "No") : "",
        s.ent ? (PV_HABITUALES.has(s.ent) ? "Sí" : "No") : "",
        e, r.obs || "", r.tec || "", r.fecha || ""]);

}
function filasNovedades() {
  const f = [];
  for (const sc of Object.keys(window.TRACKERS)) {
    const ocup = ocupacion(sc), marq = marquillas(sc);
    for (const t of window.TRACKERS[sc]) for (const nv of novedades(sc + "." + t, ocup, marq)) f.push([sc, t, "S" + (nv.i + 1), nv.txt]);
  }

}
function filasPendientes() {

  }

}

// XLSX mínimo (zip sin compresión) para no depender de librerías ni de internet
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(archivos) {
  const enc = new TextEncoder(), partes = [], central = []; let off = 0;
  for (const [nombre, texto] of archivos) {
    const nb = enc.encode(nombre), d = enc.encode(texto), crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true);
    h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
    partes.push(h, nb, d);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true);
    c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
    central.push(c, nb);
    off += 30 + nb.length + d.length;
  }
  const tam = central.reduce((a, p) => a + p.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, archivos.length, true); e.setUint16(10, archivos.length, true);
  e.setUint32(12, tam, true); e.setUint32(16, off, true);
  return new Blob([...partes, ...central, e], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xlsx(hojas) {
  const x = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  const col = i => { let s = ""; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };
  const hoja = ({ cab, filas, anchos }) => {
    const fila = (f, r, st) => `<row r="${r}">${f.map((v, c) => typeof v === "number"
      ? `<c r="${col(c)}${r}"${st}><v>${v}</v></c>`
      : `<c r="${col(c)}${r}" t="inlineStr"${st}><is><t xml:space="preserve">${x(v)}</t></is></c>`).join("")}</row>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${anchos.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${fila(cab, 1, ' s="1"')}${filas.map((f, i) => fila(f, i + 2, "")).join("")}</sheetData></worksheet>`;
  };
  const archivos = [
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${hojas.map((h, i) => `<sheet name="${x(h.nombre)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${hojas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...hojas.map((h, i) => [`xl/worksheets/sheet${i + 1}.xml`, hoja(h)]),
  ];
  return zip(archivos);
}

function csv(filas) {
  const c = v => { const s = String(v ?? ""); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return new Blob(["﻿" + [COLS, ...filas].map(f => f.map(c).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
}

async function compartir(blob, nombre) {
  const archivo = new File([blob], nombre, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try { await navigator.share({ files: [archivo], title: nombre }); return true; }
    catch (e) { if (e.name === "AbortError") return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
function nombreArchivo(ext) {
  const tec = tecnico().replace(/[^\p{L}\p{N}]+/gu, "_");
  return `strings_${tec}_${new Date().toLocaleString("sv-SE").slice(0, 16).replace(/[: ]/g, "-")}.${ext}`;
}

  if (conSync) document.getElementById("syncYa").onclick = async () => { await sincronizar(true); vistaExportar(); };

  };

    const blob = new Blob([JSON.stringify({ app: "registro-strings", version: VERSION, tecnico: tecnico(), fecha: ahora(), registros }, null, 1)], { type: "application/json" });

  };
  document.getElementById("imp").onchange = async ev => {
    let nuevos = 0, actualizados = 0;

        if (!entrantes || typeof entrantes !== "object") throw new Error("formato no reconocido");

          if (!existeTracker(id)) { errores.push(`${f.name}: ${id} no existe`); continue; }
          const actual = registros[id];
          if (!actual) { registros[id] = r; nuevos++; tocados.push(id); continue; }

function desdeCsv(texto) {
  const filas = []; let f = [], v = "", q = false;
  texto = texto.replace(/^﻿/, "");
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (q) { if (ch === '"') { if (texto[i + 1] === '"') { v += '"'; i++; } else q = false; } else v += ch; }
    else if (ch === '"') q = true;
    else if (ch === ";" || ch === ",") { f.push(v); v = ""; }
    else if (ch === "\n") { f.push(v.replace(/\r$/, "")); filas.push(f); f = []; v = ""; }
    else v += ch;
  }
  if (v || f.length) { f.push(v); filas.push(f); }
  const cab = filas.shift().map(s => s.trim());
  const ix = n => cab.indexOf(n);
  const out = {};
  for (const r of filas) {
    const id = limpio(r[ix("Nombre completo")]);
    if (!id) continue;
    const i = parseInt(String(r[ix("String")]).replace(/\D/g, ""), 10) - 1;
    const o = out[id] ||= { n: parseInt(r[ix("Nº strings")], 10) || 4, s: [], obs: r[ix("Observaciones")] || "", tec: r[ix("Técnico")] || "", fecha: r[ix("Fecha")] || "" };
    if (i >= 0) o.s[i] = {
      mTr: aNum(r[ix("Marquilla tracker")]), mInv: aNum(r[ix("Marquilla inversor")]), mStr: aNum(r[ix("Marquilla string")]),
      inv: aNum(r[ix("Inversor conectado")]), ent: aNum(r[ix("PV")]),
    };
  }
  return out;
}
