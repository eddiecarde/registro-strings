<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Strings</title>
<meta name="theme-color" content="#0f5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Strings">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f3f5f4;
  --card: #ffffff;
  --text: #14201b;
  --muted: #5b6b64;
  --line: #d5ddd9;
  --accent: #0f5132;
  --accent-text: #ffffff;
  --ok: #198754;
  --ok-bg: #d1f0de;
  --warn: #9a6200;
  --warn-bg: #fff0c2;
  --pend: #6c7a73;
  --pend-bg: #e7ecea;
  --err: #b42318;
  --err-bg: #fde4e1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1412;
    --card: #17201c;
    --text: #e7efeb;
    --muted: #9db0a7;
    --line: #2b3832;
    --accent: #3fb57e;
    --accent-text: #06120c;
    --ok: #5fd39a;
    --ok-bg: #173826;
    --warn: #f2c14e;
    --warn-bg: #3a2f10;
    --pend: #9db0a7;
    --pend-bg: #222d29;
    --err: #ff8a7a;
    --err-bg: #3d1a16;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  background: var(--accent); color: var(--accent-text);
}
header h1 { flex: 1; margin: 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header button {
  background: transparent; color: inherit; border: 1px solid currentColor;
  border-radius: 10px; padding: 8px 12px; font-size: 15px; position: relative;
}
header button.icono { border: none; font-size: 22px; padding: 4px 10px; }
.badge {
  position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 10px; background: var(--err); color: #fff; font-size: 12px; line-height: 20px; text-align: center;
}
main { max-width: 720px; margin: 0 auto; padding: 14px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
h2 { font-size: 17px; margin: 4px 0 10px; }
.muted { color: var(--muted); font-size: 14px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input, select, textarea {
  width: 100%; font-size: 18px; padding: 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
#buscar { text-transform: uppercase; }
input::placeholder { text-transform: none; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn {
  display: block; width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
  border-radius: 12px; border: none; background: var(--accent); color: var(--accent-text); margin-top: 10px;
}
.btn.sec { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.peligro { background: transparent; color: var(--err); border: 1.5px solid var(--err); }
.fila-btn { display: flex; gap: 10px; }
.fila-btn .btn { flex: 1; }

.lista-sc { display: grid; gap: 10px; }
.sc {
  display: block; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
}
.sc .top { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 18px; }
.barra { height: 8px; border-radius: 4px; background: var(--pend-bg); overflow: hidden; margin-top: 8px; display: flex; }
.barra i { display: block; height: 100%; }
.barra .c { background: var(--ok); }
.barra .p { background: var(--warn); }

.filtros { display: flex; gap: 8px; margin-bottom: 12px; }
.filtros input { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 20px; padding: 6px 12px; font-size: 14px; }
.chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.grid-t { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.t {
  display: block; text-align: center; text-decoration: none; padding: 12px 4px; border-radius: 10px;
  font-weight: 600; font-size: 16px; border: 1px solid transparent;
}
.t small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
.st-completo { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.st-parcial { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.st-pendiente { background: var(--pend-bg); color: var(--pend); }

.ficha-id { font-size: 26px; font-weight: 700; letter-spacing: .5px; margin: 0; word-break: break-all; }
.estado { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-top: 6px; }
.segm { display: flex; border: 1.5px solid var(--accent); border-radius: 12px; overflow: hidden; }
.segm button { flex: 1; padding: 12px; font-size: 17px; font-weight: 600; border: none; background: transparent; color: var(--accent); }
.segm button.on { background: var(--accent); color: var(--accent-text); }
.str { display: grid; grid-template-columns: 34px 1fr 1.25fr 1fr; gap: 6px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
.str input, .str select { font-size: 16px; padding: 12px 8px; }
.str .info, .pv .info { grid-column: 1 / -1; font-size: 13px; }
.pv { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.pv:first-child { border-top: none; }
.pv .n { font-weight: 700; font-size: 17px; padding-top: 12px; }
.pv select { font-size: 15px; padding: 11px 26px 11px 10px; }
.pv .info { margin-top: 4px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
a.enlace { text-align: center; text-decoration: none; }
h2.mppt { font-size: 14px; color: var(--muted); margin: 14px 0 0; }
h2.mppt:first-child { margin-top: 0; }
.pv.vacio .n { color: var(--muted); }
.pv.vacio select { opacity: .6; }
.pv .n small { display: block; font-size: 11px; font-weight: 400; }
.panel { display: grid; grid-template-columns: repeat(2, 1fr) 6px repeat(5, 1fr); gap: 4px; margin: 10px 0; }
.panel a { display: block; text-align: center; font-size: 13px; font-weight: 600; padding: 7px 0; border-radius: 50%; aspect-ratio: 1; text-decoration: none; border: 1.5px solid transparent; line-height: 1.6; }
.panel .sep { display: block; }
.c-ok { background: var(--ok-bg); color: var(--ok) !important; border-color: var(--ok) !important; }
.c-falta { background: var(--pend-bg); color: var(--text) !important; border-color: var(--pend) !important; }
.c-err { background: var(--err-bg); color: var(--err) !important; border-color: var(--err) !important; }
.c-vacio { color: var(--muted) !important; border: 1.5px dashed var(--line) !important; }
.leyenda span { background: none !important; border: none !important; font-size: 16px; }
.directo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; margin-top: 10px; }
.directo .btn { margin-top: 0; }
.info a { color: var(--accent); font-weight: 600; }
.str:first-of-type { border-top: none; }
.str .n { font-weight: 700; font-size: 17px; padding-bottom: 13px; text-align: center; }
.guardado { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; min-height: 18px; }
.nav-t { display: flex; gap: 10px; }
.nav-t .btn { flex: 1; }

.tip { background: var(--warn-bg); color: var(--text); border: 1px solid var(--warn); border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 12px; }
.tip b { color: var(--warn); }
.stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stat:last-child { border-bottom: none; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 15px;
  max-width: calc(100% - 32px); z-index: 10; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.ver { opacity: 1; }
.st-dup { background: var(--err-bg); color: var(--err); border-color: var(--err); }
details.card summary { display: flex; justify-content: space-between; align-items: center; font-size: 17px; cursor: pointer; list-style: none; }
details.card summary::-webkit-details-marker { display: none; }
.grid-e { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 12px; }
.ent-c { display: block; padding: 8px 6px; border-radius: 8px; border: 1px solid transparent; font-size: 13px; text-decoration: none; text-align: center; }
.ent-c b { display: block; font-size: 14px; }
.ent-c span { display: block; word-break: break-word; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 24px; }
.oculto { display: none !important; }
</style>
</head>
<body>
<header>
  <button id="btnAtras" class="icono oculto" aria-label="Atrás">‹</button>
  <h1 id="titulo">Registro de Strings</h1>
  <button id="btnExportar">Exportar<span id="badge" class="badge oculto"></span></button>
  <button id="btnConfig" class="icono" aria-label="Ajustes">⚙</button>
</header>
<main id="app"></main>
<div id="toast" class="toast"></div>

<script src="trackers.js"></script>
<script>
"use strict";
const VERSION = "1.5.0";
// Configuración de la planta: inversores por subcampo y entradas (strings) por inversor
const INVERSORES = 22, ENTRADAS = 20;  // ENTRADAS = strings por inversor
// Conectores del inversor: 28 PV en 6 MPPT. Los 20 "habituales" son los que normalmente van conectados
const PV_TOTAL = 28;
const PV_HABITUALES = new Set([2, 3, 4, 6, 7, 8, 9, 10, 11, 12, 16, 17, 18, 21, 22, 23, 25, 26, 27, 28]);
const MPPT_RANGOS = [[1, 1, 4], [2, 5, 9], [3, 10, 14], [4, 15, 18], [5, 19, 23], [6, 24, 28]];
// Vista frontal del inversor (null = separación entre MPPT)
const PANEL = [
  { arriba: [2, 4, null, 10, 11, 12, 13, 14], abajo: [1, 3, null, 5, 6, 7, 8, 9] },
  { arriba: [16, 18, null, 24, 25, 26, 27, 28], abajo: [15, 17, null, 19, 20, 21, 22, 23] },
];
const K = { reg: "rs_registros", tec: "rs_tecnico", exp: "rs_ultima_exportacion", cambios: "rs_cambios", ultSc: "rs_ultimo_subcampo", ultInv: "rs_ultimo_inversor" };
const app = document.getElementById("app");

// ---------- Almacenamiento ----------
function leer(clave, defecto) {
  try { const v = localStorage.getItem(clave); return v === null ? defecto : JSON.parse(v); }
  catch (e) { return defecto; }
}
function escribir(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); return true; }
  catch (e) { toast("⚠ No se pudo guardar en el teléfono. Exporta tus datos."); return false; }
}
let registros = leer(K.reg, {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// K.cambios guarda los trackers modificados desde la última exportación
function guardarRegistros(ids = []) {
  escribir(K.reg, registros);
  const cambios = new Set(leer(K.cambios, []));
  ids.forEach(i => cambios.add(i));
  escribir(K.cambios, [...cambios]);
  pintarBadge();
}
function nCambios() { const c = leer(K.cambios, []); return Array.isArray(c) ? c.length : 0; }

// ---------- Utilidades ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const limpio = s => String(s ?? "").trim().toUpperCase();
const ahora = () => new Date().toLocaleString("sv-SE").slice(0, 16);
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("ver");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("ver"), 2600);
}
function tecnico() { return leer(K.tec, ""); }
function nStrings(id) { return registros[id]?.n || window.STRINGS_DEFECTO[id] || 4; }

const pad = n => String(n).padStart(2, "0");
const fmtInv = n => "INV " + pad(n);
const fmtPV = n => "PV" + n;
const aNum = v => { const n = parseInt(String(v ?? "").replace(/\D/g, ""), 10); return Number.isFinite(n) ? n : ""; };
const numTr = t => parseInt(String(t).replace(/\D/g, ""), 10);
const prefTr = t => String(t).replace(/\d+$/, "");
const fmtTr = (n, pref = "MQR") => pref + String(n).padStart(3, "0");
// Por string: mTr/mInv/mStr = lo que dice la marquilla del cable; inv/ent = inversor y PV donde está conectado
const CAMPOS = ["mTr", "mInv", "mStr", "inv", "ent"];
const TXT_CAMPO = { mTr: "marquilla tracker", mInv: "marquilla inversor", mStr: "marquilla string", inv: "inversor", ent: "PV" };
const levantado = s => !!(s && s.mTr && s.mInv && s.mStr);
const conectado = s => !!(s && s.inv && s.ent);

function avance(id) {
  const r = registros[id], n = nStrings(id); let lev = 0, con = 0;
  for (let i = 0; i < n; i++) { const s = r?.s?.[i]; if (levantado(s)) lev++; if (conectado(s)) con++; }
  return { n, lev, con };
}
function estado(id) {
  if (!registros[id]) return "pendiente";
  const a = avance(id);
  return a.lev === a.n && a.con === a.n ? "completo" : "parcial";
}
const TXT_ESTADO = { completo: "Completo", parcial: "Incompleto", pendiente: "Pendiente" };

function resumenSC(sc) {
  const ts = window.TRACKERS[sc]; let c = 0, p = 0;
  for (const t of ts) { const e = estado(sc + "." + t); if (e === "completo") c++; else if (e === "parcial") p++; }
  return { total: ts.length, c, p };
}

// Ocupación de un subcampo: "inv|pv" -> lista de {id, i} (tracker y string conectados ahí)
function ocupacion(sc) {
  const m = {};
  for (const [id, r] of Object.entries(registros)) {
    if (!id.startsWith(sc + ".")) continue;
    const n = r.n || 4;
    for (let i = 0; i < n; i++) {
      const s = r.s?.[i];
      if (conectado(s)) (m[s.inv + "|" + s.ent] ||= []).push({ id, i });
    }
  }
  return m;
}

// Marquillas del subcampo: "mInv|mStr" -> lista de {id, i} que la tienen anotada
function marquillas(sc) {
  const m = {};
  for (const [id, r] of Object.entries(registros)) {
    if (!id.startsWith(sc + ".")) continue;
    for (let i = 0; i < (r.n || 4); i++) {
      const s = r.s?.[i];
      if (s && s.mInv && s.mStr) (m[s.mInv + "|" + s.mStr] ||= []).push({ id, i });
    }
  }
  return m;
}

// Diferencias encontradas en un tracker: marquilla de otro tracker, otro inversor, o PV con dos strings
function novedades(id, ocup, marq) {
  const r = registros[id]; if (!r) return [];
  const [sc, t] = id.split("."), real = numTr(t), out = [];
  ocup ||= ocupacion(sc); marq ||= marquillas(sc);
  for (let i = 0; i < (r.n || 4); i++) {
    const s = r.s?.[i]; if (!s) continue;
    const S = "S" + (i + 1);
    if (s.mTr && s.mTr !== real) out.push({ i, txt: `${S}: la marquilla dice tracker ${fmtTr(s.mTr, prefTr(t))}` });
    if (s.mInv && s.inv && s.mInv !== s.inv) out.push({ i, txt: `${S}: la marquilla dice ${fmtInv(s.mInv)} pero está conectado en ${fmtInv(s.inv)}` });
    if (conectado(s) && !PV_HABITUALES.has(s.ent)) out.push({ i, txt: `${S}: conectado en ${fmtInv(s.inv)} ${fmtPV(s.ent)}, que normalmente va vacío` });
    if (s.mInv && s.mStr && (marq[s.mInv + "|" + s.mStr] || []).length > 1) out.push({ i, txt: `${S}: marquilla ${fmtInv(s.mInv)} string ${s.mStr} repetida en otro string del subcampo` });
    if (conectado(s) && (ocup[s.inv + "|" + s.ent] || []).length > 1) out.push({ i, txt: `${S}: ${fmtInv(s.inv)} ${fmtPV(s.ent)} tiene más de un string` });
  }
  return out;
}
function novedadesSC(sc) {
  const ocup = ocupacion(sc), marq = marquillas(sc);
  return window.TRACKERS[sc].reduce((a, t) => a + novedades(sc + "." + t, ocup, marq).length, 0);
}

function sellar(ids) {
  for (const id of new Set(ids)) if (registros[id]) { registros[id].tec = tecnico(); registros[id].fecha = ahora(); }
}

// ---------- Navegación ----------
const btnAtras = document.getElementById("btnAtras");
const titulo = document.getElementById("titulo");
let destinoAtras = "#/";
btnAtras.onclick = () => { history.length > 1 ? history.back() : (location.hash = destinoAtras); };
document.getElementById("btnExportar").onclick = () => { location.hash = "#/exportar"; };
document.getElementById("btnConfig").onclick = () => { location.hash = "#/ajustes"; };
window.addEventListener("hashchange", enrutar);

function cabecera(txt, atras) {
  titulo.textContent = txt;
  btnAtras.classList.toggle("oculto", !atras);
  destinoAtras = atras || "#/";
}

function enrutar() {
  window.scrollTo(0, 0);
  if (!tecnico()) return vistaTecnico();
  const h = decodeURIComponent(location.hash.slice(1) || "/");
  let m;
  if ((m = h.match(/^\/sc\/(.+)$/)) && window.TRACKERS[m[1]]) return vistaSubcampo(m[1]);
  if ((m = h.match(/^\/t\/([^.]+)\.(.+)$/)) && window.TRACKERS[m[1]]?.includes(m[2])) return vistaFicha(m[1], m[2]);
  if ((m = h.match(/^\/inv\/([^/]+)\/(\d+)$/)) && window.TRACKERS[m[1]] && +m[2] >= 1 && +m[2] <= INVERSORES) return vistaInversor(m[1], +m[2]);
  if ((m = h.match(/^\/inv\/([^/]+)$/)) && window.TRACKERS[m[1]]) return vistaInversores(m[1]);
  if (h === "/exportar") return vistaExportar();
  if (h === "/ajustes") return vistaAjustes();
  return vistaInicio();
}

// ---------- Vistas ----------
function vistaTecnico() {
  cabecera("Registro de Strings");
  app.innerHTML = `
    <div class="card">
      <h2>Bienvenido</h2>
      <p class="muted">Escribe tu nombre. Quedará en cada registro que hagas.</p>
      <label for="nom">Nombre del técnico</label>
      <input id="nom" autocomplete="name" value="${esc(tecnico())}">
      <button class="btn" id="ok">Continuar</button>
    </div>`;
  const nom = document.getElementById("nom");
  document.getElementById("ok").onclick = () => {
    const v = nom.value.trim();
    if (!v) { toast("Escribe tu nombre"); nom.focus(); return; }
    escribir(K.tec, v);
    location.hash = "#/"; enrutar();
  };
}

function tipInstalar() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const instalada = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (instalada) return "";
  return `<div class="tip"><b>Instala la app para usarla sin internet:</b><br>
    ${ios ? "En Safari toca <b>Compartir</b> (□↑) → <b>Añadir a pantalla de inicio</b>."
          : "En Chrome toca el menú <b>⋮</b> → <b>Instalar aplicación</b> / <b>Añadir a pantalla de inicio</b>."}</div>`;
}

function vistaInicio() {
  cabecera("Registro de Strings");
  const ultSc = leer(K.ultSc, "");
  let tc = 0, tt = 0;
  const cards = Object.keys(window.TRACKERS).map(sc => {
    const r = resumenSC(sc); tc += r.c; tt += r.total;
    return `<a class="sc" href="#/sc/${esc(sc)}">
      <div class="top"><span>${esc(sc)}</span><span class="muted">${r.c}/${r.total}</span></div>
      <div class="barra"><i class="c" style="width:${r.c / r.total * 100}%"></i><i class="p" style="width:${r.p / r.total * 100}%"></i></div>
      ${r.p ? `<div class="muted" style="margin-top:6px">${r.p} incompleto(s)</div>` : ""}
    </a>`;
  }).join("");
  app.innerHTML = `${tipInstalar()}
    <div class="card"><div class="stat"><span>Técnico</span><b>${esc(tecnico())}</b></div>
    <div class="stat"><span>Trackers completos</span><b>${tc} / ${tt}</b></div></div>
    <div class="card">
      <h2>Ir directo</h2>
      <label for="dSc">Subcampo</label>
      <select id="dSc">${Object.keys(window.TRACKERS).map(sc => `<option ${sc === ultSc ? "selected" : ""}>${esc(sc)}</option>`).join("")}</select>
      <div class="directo">
        <div><label for="dInv">Inversor</label><select id="dInv">${Array.from({ length: INVERSORES }, (_, k) => `<option value="${k + 1}" ${k + 1 === leer(K.ultInv, 1) ? "selected" : ""}>${fmtInv(k + 1)}</option>`).join("")}</select></div>
        <button class="btn" id="irInv">Ir al inversor</button>
      </div>
      <div class="directo">
        <div><label for="dTr">Tracker</label><input id="dTr" inputmode="numeric" placeholder="Ej. 85"></div>
        <button class="btn sec" id="irTr">Ir al tracker</button>
      </div>
    </div>
    <h2>Subcampos</h2>
    <div class="lista-sc">${cards}</div>`;
  const dSc = document.getElementById("dSc"), dTr = document.getElementById("dTr");
  dSc.onchange = () => escribir(K.ultSc, dSc.value);
  document.getElementById("irInv").onclick = () => {
    const inv = +document.getElementById("dInv").value;
    escribir(K.ultSc, dSc.value); escribir(K.ultInv, inv);
    location.hash = `#/inv/${dSc.value}/${inv}`;
  };
  const irTracker = () => {
    const q = numTr(dTr.value), t = window.TRACKERS[dSc.value].find(x => numTr(x) === q);
    if (!t) return toast(`No existe el tracker ${dTr.value || "?"} en ${dSc.value}`);
    escribir(K.ultSc, dSc.value);
    location.hash = `#/t/${dSc.value}.${t}`;
  };
  document.getElementById("irTr").onclick = irTracker;
  dTr.addEventListener("keydown", e => { if (e.key === "Enter") irTracker(); });
}

let filtroSC = "todos";

    <div class="card"><div class="stat"><span>Trackers completos</span><b>${r.c} / ${r.total}</b></div>
      <div class="stat"><span>Novedades (marquillas que no coinciden)</span><b class="${nov ? "err" : ""}">${nov}</b></div>
      <div class="barra"><i class="c" style="width:${r.c / r.total * 100}%"></i><i class="p" style="width:${r.p / r.total * 100}%"></i></div>
      <a class="btn sec enlace" href="#/inv/${esc(sc)}">Paso 2: en los ${INVERSORES} inversores</a></div>
    <h2>Paso 1: en los trackers</h2>
    <p class="muted" style="margin-top:-6px">M = marquillas anotadas · I = asociados en inversor</p>

      ${["todos", "pendiente", "parcial", "completo"].map(f =>

    </div>
    <div class="grid-t" id="grid"></div>`;
  const grid = document.getElementById("grid"), buscar = document.getElementById("buscar");
  function pintar() {
    const q = buscar.value.replace(/\D/g, "");
    const html = window.TRACKERS[sc].filter(t => {
      const e = estado(sc + "." + t);
      if (filtroSC !== "todos" && e !== filtroSC) return false;
      return !q || String(parseInt(t.replace(/\D/g, ""), 10)).includes(String(parseInt(q, 10)));
    }).map(t => {
      const id = sc + "." + t, e = estado(id), a = avance(id);
      return `<a class="t st-${e}" href="#/t/${esc(id)}">${esc(t.replace(/^\D+/, ""))}<small>M${a.lev}/${a.n} · I${a.con}/${a.n}</small></a>`;
    }).join("");
    grid.innerHTML = html || `<p class="muted">Sin resultados</p>`;
  }
  buscar.addEventListener("input", pintar);
  buscar.addEventListener("keydown", e => {

  });
  app.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    filtroSC = c.dataset.f; app.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); pintar();
  });
  pintar();
}

// Paso 1, en el tracker: lo que dicen las marquillas de los cables de cada string
function vistaFicha(sc, t) {
  const id = sc + "." + t, real = numTr(t), pref = prefTr(t);
  const lista = window.TRACKERS[sc], idx = lista.indexOf(t);
  cabecera(t, "#/sc/" + sc);
  const r = registros[id] || {};
  let n = nStrings(id);

  app.innerHTML = `
    <div class="card">
      <p class="muted" style="margin:0">Subcampo ${esc(sc)} · tracker ${idx + 1} de ${lista.length}</p>
      <p class="ficha-id">${esc(id)}</p>
      <span class="estado" id="estado"></span>
    </div>
    <div class="card">
      <label>¿Cuántos strings tiene este tracker?</label>
      <div class="segm" id="segm">
        <button data-n="2">2 strings</button><button data-n="4">4 strings</button>
      </div>
    </div>
    <div class="card">
      <h2>Marquillas de los cables</h2>
      <p class="muted" style="margin-top:-6px">Para cada string anota lo que dice la marquilla del cable solar: tracker, inversor y string.</p>
      <div id="strs"></div>
      <label for="obs" style="margin-top:12px">Observaciones</label>
      <textarea id="obs" rows="2">${esc(r.obs || "")}</textarea>
      <div class="guardado" id="guardado">${r.fecha ? `Guardado ${esc(r.fecha)} · ${esc(r.tec)}` : "Se guarda automáticamente"}</div>
    </div>
    <div class="nav-t">
      <button class="btn sec" id="ant" ${idx === 0 ? "disabled" : ""}>‹ Anterior</button>
      <button class="btn" id="sig" ${idx === lista.length - 1 ? "disabled" : ""}>Siguiente ›</button>
    </div>
    <a class="btn sec enlace" id="irInv" href="#/inv/${esc(sc)}">Ir a los inversores</a>
    <button class="btn peligro" id="borrar" ${registros[id] ? "" : "style='display:none'"}>Borrar datos de este tracker</button>`;

  const strs = document.getElementById("strs");
  const opts = (max, sel, fmt) => `<option value="">—</option>` +
    Array.from({ length: max }, (_, k) => k + 1).map(v => `<option value="${v}" ${v === sel ? "selected" : ""}>${fmt(v)}</option>`).join("");
  const leerForm = () => [...strs.querySelectorAll(".str")].map(div => ({
    mTr: aNum(div.querySelector(".mTr").value), mInv: aNum(div.querySelector(".mInv").value), mStr: aNum(div.querySelector(".mStr").value),
  }));

  function pintarStrings(valores) {
    document.querySelectorAll("#segm button").forEach(b => b.classList.toggle("on", +b.dataset.n === n));
    let html = "";
    for (let i = 0; i < n; i++) {
      const s = { ...(registros[id]?.s?.[i] || {}), ...(valores?.[i] || {}) };
      html += `<div class="str" data-i="${i}">
        <div class="n">S${i + 1}</div>
        <div><label>Tracker</label><input class="mTr" inputmode="numeric" value="${s.mTr || real}"></div>
        <div><label>Inversor</label><select class="mInv">${opts(INVERSORES, s.mInv || "", fmtInv)}</select></div>
        <div><label>String</label><select class="mStr">${opts(ENTRADAS, s.mStr || "", v => "S" + v)}</select></div>
        <div class="info"></div>
      </div>`;
    }
    strs.innerHTML = html;
    strs.querySelectorAll("input, select").forEach(el => el.addEventListener("change", () => {
      // El inversor de S1 se copia a los strings que aún no lo tienen
      if (el.classList.contains("mInv") && el.closest(".str").dataset.i === "0")
        strs.querySelectorAll(".mInv").forEach(o => { if (!o.value) o.value = el.value; });
      guardar();
    }));
    validar();
  }

  function validar() {
    const ocup = ocupacion(sc), marq = marquillas(sc);
    strs.querySelectorAll(".str").forEach(div => {
      const i = +div.dataset.i, s = registros[id]?.s?.[i] || {}, msgs = [];
      const mTr = aNum(div.querySelector(".mTr").value), mInv = aNum(div.querySelector(".mInv").value), mStr = aNum(div.querySelector(".mStr").value);
      if (mTr && mTr !== real) msgs.push(`<span class="warn">⚠ La marquilla es de otro tracker: ${fmtTr(mTr, pref)}</span>`);
      const rep = (marq[mInv + "|" + mStr] || []).filter(u => !(u.id === id && u.i === i));
      if (mInv && mStr && rep.length) msgs.push(`<span class="warn">⚠ ${fmtInv(mInv)} S${mStr} ya está anotada en ${rep.map(u => `${u.id.split(".")[1]} S${u.i + 1}`).join(", ")}</span>`);
      if (conectado(s)) {
        msgs.push(`<span class="ok">Conectado en ${fmtInv(s.inv)} · ${fmtPV(s.ent)}</span>`);
        if (mInv && mInv !== s.inv) msgs.push(`<span class="err">⚠ La marquilla dice ${fmtInv(mInv)}</span>`);
        if (!PV_HABITUALES.has(s.ent)) msgs.push(`<span class="err">⚠ ${fmtPV(s.ent)} normalmente va vacío</span>`);
        if ((ocup[s.inv + "|" + s.ent] || []).length > 1) msgs.push(`<span class="err">⚠ Ese PV tiene otro string</span>`);
      } else msgs.push(`<span class="muted">Falta asociar en el inversor</span>`);
      div.querySelector(".info").innerHTML = msgs.join("<br>");
    });
    const e = estado(id), el = document.getElementById("estado");
    el.textContent = TXT_ESTADO[e]; el.className = "estado st-" + e;
    const inv1 = aNum(strs.querySelector(".mInv")?.value);
    const ir = document.getElementById("irInv");
    ir.href = inv1 ? `#/inv/${sc}/${inv1}` : `#/inv/${sc}`;
    ir.textContent = inv1 ? `Ir al ${fmtInv(inv1)} (asociar PV)` : "Ir a los inversores";
  }

  function guardar() {
    const prev = registros[id]?.s || [];
    // Mezcla con lo existente para no perder la conexión al inversor ni los strings 3-4 ocultos
    const s = leerForm().map((f, i) => ({ ...(prev[i] || {}), ...f }));
    for (let i = s.length; i < prev.length; i++) s[i] = prev[i];
    registros[id] = { n, s, obs: document.getElementById("obs").value.trim(), tec: tecnico(), fecha: ahora() };
    guardarRegistros([id]);
    document.getElementById("guardado").textContent = `Guardado ${registros[id].fecha} · ${tecnico()}`;
    document.getElementById("borrar").style.display = "";
    validar();
  }

  document.querySelectorAll("#segm button").forEach(b => b.onclick = () => {
    const form = leerForm(); n = +b.dataset.n; pintarStrings(form); guardar();
  });
  document.getElementById("obs").addEventListener("input", guardar);
  document.getElementById("ant").onclick = () => { location.replace(`#/t/${sc}.${lista[idx - 1]}`); };
  document.getElementById("sig").onclick = () => {
    const a = avance(id);
    if (a.lev < a.n && !confirm("Faltan marquillas por anotar en este tracker. ¿Pasar al siguiente de todas formas?")) return;
    location.replace(`#/t/${sc}.${lista[idx + 1]}`);
  };
  document.getElementById("borrar").onclick = () => {
    if (!confirm(`¿Borrar los datos registrados de ${id}?`)) return;
    delete registros[id]; guardarRegistros([id]); toast("Datos borrados"); vistaFicha(sc, t);
  };
  pintarStrings();
}

// Paso 2, en el inversor: lista de los inversores del subcampo
function vistaInversores(sc) {
  cabecera("Inversores " + sc, "#/sc/" + sc);
  const ocup = ocupacion(sc), esperados = {};
  for (const t of window.TRACKERS[sc]) {
    const r = registros[sc + "." + t]; if (!r) continue;
    for (let i = 0; i < (r.n || 4); i++) { const s = r.s?.[i]; if (levantado(s)) esperados[s.mInv] = (esperados[s.mInv] || 0) + 1; }
  }
  let total = 0;
  const filas = Array.from({ length: INVERSORES }, (_, k) => k + 1).map(inv => {
    let usadas = 0, dup = 0, fuera = 0;
    for (let e = 1; e <= PV_TOTAL; e++) {
      const u = ocup[inv + "|" + e] || [];
      if (u.length) PV_HABITUALES.has(e) ? usadas++ : fuera++;
      if (u.length > 1) dup++;
    }
    total += usadas;
    const alertas = [dup && `${dup} PV con dos strings`, fuera && `${fuera} en PV que normalmente va vacío`].filter(Boolean);
    return `<a class="sc" href="#/inv/${esc(sc)}/${inv}">
      <div class="top"><span>${fmtInv(inv)}</span><span class="muted">${usadas}/${PV_HABITUALES.size} PV</span></div>
      <div class="barra"><i class="c" style="width:${usadas / PV_HABITUALES.size * 100}%"></i></div>
      <div class="muted" style="margin-top:6px">${esperados[inv] || 0} strings con marquilla de este inversor${alertas.length ? ` · <span class="err">${alertas.join(" · ")}</span>` : ""}</div>
    </a>`;
  }).join("");
  app.innerHTML = `
    <div class="card"><div class="stat"><span>PV asociados en el subcampo</span><b>${total} / ${INVERSORES * PV_HABITUALES.size}</b></div></div>
    <div class="lista-sc">${filas}</div>`;
}

// Paso 2, en el inversor: a cada PV se le asigna el string cuyo cable llega ahí
function vistaInversor(sc, inv) {
  escribir(K.ultSc, sc); escribir(K.ultInv, inv);
  cabecera(`${fmtInv(inv)} · ${sc}`, "#/inv/" + sc);
  const grupos = { propio: [], otros: [], sin: [] };
  for (const t of window.TRACKERS[sc]) {
    const id = sc + "." + t, n = nStrings(id);
    for (let i = 0; i < n; i++) {
      const s = registros[id]?.s?.[i] || {}, it = { v: id + "|" + i, s, t, i };
      if (!levantado(s)) grupos.sin.push(it);
      else (s.mInv === inv ? grupos.propio : grupos.otros).push(it);
    }
  }
  const orden = (a, b) => (a.s.mInv - b.s.mInv) || (a.s.mStr - b.s.mStr) || (a.s.mTr - b.s.mTr);
  grupos.propio.sort(orden); grupos.otros.sort(orden);
  // La opción se lee como la marquilla del cable; si la marquilla es de otro tracker se indica el real
  const etiqueta = ({ s, t, i }) => {
    let txt = levantado(s) ? `S${s.mStr} · ${fmtTr(s.mTr, prefTr(t))} · ${fmtInv(s.mInv)}` : `${t} S${i + 1} (sin marquilla anotada)`;
    if (levantado(s) && s.mTr !== numTr(t)) txt += ` → real ${t} S${i + 1}`;
    // ✓ = ese string ya está asociado a algún PV
    return (conectado(s) ? "✓ " : "") + txt;
  };
  const optsHtml = `<option value="">— libre —</option>` +
    [[`Marquilla dice ${fmtInv(inv)}`, grupos.propio], ["Marquilla de otro inversor", grupos.otros], ["Sin marquilla anotada", grupos.sin]]
      .filter(g => g[1].length)
      .map(([lbl, arr]) => `<optgroup label="${esc(lbl)}">${arr.map(it => `<option value="${esc(it.v)}">${esc(etiqueta(it))}</option>`).join("")}</optgroup>`).join("");

  const ocup = ocupacion(sc);
  let filas = "";
  for (const [m, desde, hasta] of MPPT_RANGOS) {
    filas += `<h2 class="mppt">MPPT${m}</h2>`;
    for (let pv = desde; pv <= hasta; pv++) {
      const hab = PV_HABITUALES.has(pv);
      filas += `<div class="pv ${hab ? "" : "vacio"}" data-pv="${pv}" id="pv${pv}"><div class="n">${fmtPV(pv)}${hab ? "" : "<small>vacío</small>"}</div>
        <div><select class="sel">${optsHtml}</select><div class="info"></div></div></div>`;
    }
  }
  const celda = pv => {
    if (pv === null) return `<i class="sep"></i>`;
    const u = ocup[inv + "|" + pv] || [], hab = PV_HABITUALES.has(pv);
    const cls = u.length > 1 || (u.length && !hab) ? "c-err" : u.length ? "c-ok" : hab ? "c-falta" : "c-vacio";
    return `<a class="${cls}" href="#pv${pv}" data-ir="${pv}">${pv}</a>`;
  };
  const panel = PANEL.map(lado => `<div class="panel">${lado.arriba.map(celda).join("")}${lado.abajo.map(celda).join("")}</div>`).join("");
  app.innerHTML = `
    <div class="card">
      <div class="stat"><span>PV habituales conectados</span><b id="cnt"></b></div>
      ${panel}
      <p class="muted leyenda"><span class="c-ok">■</span> conectado <span class="c-falta">■</span> falta <span class="c-err">■</span> novedad <span class="c-vacio">■</span> normalmente vacío</p>
      <p class="muted">Lee la marquilla del cable que llega a cada PV y elige ese string (ordenados por número de string). Primero aparecen los que dicen ${fmtInv(inv)}. ✓ = string ya asociado a algún PV.</p>
    </div>
    <div class="card">${filas}</div>
    <div class="nav-t">
      <button class="btn sec" id="ant" ${inv === 1 ? "disabled" : ""}>‹ ${inv > 1 ? fmtInv(inv - 1) : ""}</button>
      <button class="btn" id="sig" ${inv === INVERSORES ? "disabled" : ""}>${inv < INVERSORES ? fmtInv(inv + 1) : ""} ›</button>
    </div>`;

  let usadas = 0;
  app.querySelectorAll("[data-ir]").forEach(a => a.onclick = ev => {
    ev.preventDefault(); document.getElementById("pv" + a.dataset.ir).scrollIntoView({ behavior: "smooth", block: "center" });
  });
  app.querySelectorAll(".pv").forEach(div => {
    const pv = +div.dataset.pv, u = ocup[inv + "|" + pv] || [], msgs = [];
    div.querySelector(".sel").value = u[0] ? u[0].id + "|" + u[0].i : "";
    if (u.length && PV_HABITUALES.has(pv)) usadas++;
    if (u.length && !PV_HABITUALES.has(pv)) msgs.push(`<span class="err">⚠ Novedad: este PV normalmente va vacío</span>`);
    if (u.length > 1) msgs.push(`<span class="err">⚠ Hay ${u.length} strings en este PV: ${u.map(x => `${esc(x.id.split(".")[1])} S${x.i + 1}`).join(", ")}</span>`);
    if (u[0]) {
      const s = registros[u[0].id].s[u[0].i], t = u[0].id.split(".")[1];
      msgs.push(`Tracker real: <a href="#/t/${esc(u[0].id)}">${esc(t)} S${u[0].i + 1}</a>`);
      if (s.mInv && s.mInv !== inv) msgs.push(`<span class="err">⚠ La marquilla dice ${fmtInv(s.mInv)}</span>`);
      if (s.mTr && s.mTr !== numTr(t)) msgs.push(`<span class="warn">⚠ Marquilla de ${fmtTr(s.mTr, prefTr(t))}</span>`);
    }
    div.querySelector(".info").innerHTML = msgs.join(" · ");
  });
  document.getElementById("cnt").textContent = `${usadas} / ${PV_HABITUALES.size}`;

  app.querySelectorAll(".pv .sel").forEach(sel => sel.addEventListener("change", () => {
    const pv = +sel.closest(".pv").dataset.pv, y = window.scrollY;
    let destino = null;
    if (sel.value) {
      const k = sel.value.lastIndexOf("|");
      destino = { id: sel.value.slice(0, k), i: +sel.value.slice(k + 1) };
      const s = registros[destino.id]?.s?.[destino.i];
      if (conectado(s) && !(s.inv === inv && s.ent === pv) &&
          !confirm(`Ese string ya está en ${fmtInv(s.inv)} ${fmtPV(s.ent)}. ¿Moverlo a ${fmtInv(inv)} ${fmtPV(pv)}?`)) {
        vistaInversor(sc, inv); window.scrollTo(0, y); return;
      }
    }
    const cambiados = [];
    // Libera lo que estaba en este PV y conecta el string elegido
    for (const u of ocupacion(sc)[inv + "|" + pv] || []) { Object.assign(registros[u.id].s[u.i], { inv: "", ent: "" }); cambiados.push(u.id); }
    if (destino) {
      const r = registros[destino.id] ||= { n: nStrings(destino.id), s: [], obs: "" };
      Object.assign(r.s[destino.i] ||= {}, { inv, ent: pv });
      cambiados.push(destino.id);
    }
    sellar(cambiados); guardarRegistros(cambiados);
    vistaInversor(sc, inv); window.scrollTo(0, y);
  }));
  document.getElementById("ant").onclick = () => location.replace(`#/inv/${sc}/${inv - 1}`);
  document.getElementById("sig").onclick = () => location.replace(`#/inv/${sc}/${inv + 1}`);
}

// ---------- Exportar / importar ----------
const COLS = ["Subcampo", "Tracker real", "Nombre completo", "Nº strings", "String", "Marquilla tracker", "Marquilla inversor", "Marquilla string",
  "Inversor conectado", "PV", "Marquilla = tracker", "Marquilla = inversor", "PV habitual", "Estado", "Observaciones", "Técnico", "Fecha"];
const ANCHOS = [10, 11, 16, 10, 7, 15, 16, 14, 16, 7, 17, 18, 19, 11, 24, 16, 17];
function filasExport() {
  const filas = [];
  for (const sc of Object.keys(window.TRACKERS)) for (const t of window.TRACKERS[sc]) {
    const id = sc + "." + t, r = registros[id];
    if (!r) continue;
    const n = r.n || 4, e = TXT_ESTADO[estado(id)], real = numTr(t);
    for (let i = 0; i < n; i++) {
      const s = r.s?.[i] || {};
      filas.push([sc, t, id, n, "S" + (i + 1),
        s.mTr ? fmtTr(s.mTr, prefTr(t)) : "", s.mInv || "", s.mStr ? "S" + s.mStr : "",
        s.inv || "", s.ent ? fmtPV(s.ent) : "",
        s.mTr ? (s.mTr === real ? "Sí" : "No") : "", s.mInv && s.inv ? (s.mInv === s.inv ? "Sí" : "No") : "",
        s.ent ? (PV_HABITUALES.has(s.ent) ? "Sí" : "No") : "",
        e, r.obs || "", r.tec || "", r.fecha || ""]);
    }
  }
  return filas;
}
function filasNovedades() {
  const f = [];
  for (const sc of Object.keys(window.TRACKERS)) {
    const ocup = ocupacion(sc), marq = marquillas(sc);
    for (const t of window.TRACKERS[sc]) for (const nv of novedades(sc + "." + t, ocup, marq)) f.push([sc, t, "S" + (nv.i + 1), nv.txt]);
  }
  return f;
}
function filasPendientes() {
  const f = [];
  for (const sc of Object.keys(window.TRACKERS)) for (const t of window.TRACKERS[sc]) {
    const id = sc + "." + t, e = estado(id), a = avance(id);
    if (e !== "completo") f.push([sc, t, id, TXT_ESTADO[e], `${a.lev}/${a.n}`, `${a.con}/${a.n}`]);
  }
  return f;
}

// Une dos registros del mismo tracker campo por campo (ej. uno levantó marquillas y otro el inversor)
function fusionar(a, b) {
  const [rec, ant] = (b.fecha || "") > (a.fecha || "") ? [b, a] : [a, b];
  const out = { n: rec.n || ant.n || 4, s: [], obs: rec.obs || ant.obs || "", tec: rec.tec || ant.tec || "", fecha: rec.fecha || ant.fecha || "" };
  const dif = [];
  for (let i = 0; i < 4; i++) {
    const x = rec.s?.[i] || {}, y = ant.s?.[i] || {}, s = {};
    for (const c of CAMPOS) {
      s[c] = x[c] || y[c] || "";
      if (x[c] && y[c] && x[c] !== y[c]) dif.push(`S${i + 1} ${TXT_CAMPO[c]}`);
    }
    out.s[i] = s;
  }
  return [out, dif, rec];
}

// XLSX mínimo (zip sin compresión) para no depender de librerías ni de internet
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(archivos) {
  const enc = new TextEncoder(), partes = [], central = []; let off = 0;
  for (const [nombre, texto] of archivos) {
    const nb = enc.encode(nombre), d = enc.encode(texto), crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(8, 0, true); h.setUint16(10, 0, true); h.setUint16(12, 0x21, true);
    h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true);
    h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
    partes.push(h, nb, d);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true);
    c.setUint16(28, nb.length, true); c.setUint32(42, off, true);
    central.push(c, nb);
    off += 30 + nb.length + d.length;
  }
  const tam = central.reduce((a, p) => a + p.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, archivos.length, true); e.setUint16(10, archivos.length, true);
  e.setUint32(12, tam, true); e.setUint32(16, off, true);
  return new Blob([...partes, ...central, e], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xlsx(hojas) {
  const x = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  const col = i => { let s = ""; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };
  const hoja = ({ cab, filas, anchos }) => {
    const fila = (f, r, st) => `<row r="${r}">${f.map((v, c) => typeof v === "number"
      ? `<c r="${col(c)}${r}"${st}><v>${v}</v></c>`
      : `<c r="${col(c)}${r}" t="inlineStr"${st}><is><t xml:space="preserve">${x(v)}</t></is></c>`).join("")}</row>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${anchos.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${fila(cab, 1, ' s="1"')}${filas.map((f, i) => fila(f, i + 2, "")).join("")}</sheetData></worksheet>`;
  };
  const archivos = [
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${hojas.map((h, i) => `<sheet name="${x(h.nombre)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${hojas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...hojas.map((h, i) => [`xl/worksheets/sheet${i + 1}.xml`, hoja(h)]),
  ];
  return zip(archivos);
}

function csv(filas) {
  const c = v => { const s = String(v ?? ""); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return new Blob(["﻿" + [COLS, ...filas].map(f => f.map(c).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
}

async function compartir(blob, nombre) {
  const archivo = new File([blob], nombre, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try { await navigator.share({ files: [archivo], title: nombre }); return true; }
    catch (e) { if (e.name === "AbortError") return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
function nombreArchivo(ext) {
  const tec = tecnico().replace(/[^\p{L}\p{N}]+/gu, "_");
  return `strings_${tec}_${new Date().toLocaleString("sv-SE").slice(0, 16).replace(/[: ]/g, "-")}.${ext}`;
}
function marcarExportado() { escribir(K.exp, ahora()); escribir(K.cambios, []); pintarBadge(); }

function vistaExportar() {
  cabecera("Exportar datos", "#/");
  const filas = filasExport(), nt = Object.keys(registros).length;
  app.innerHTML = `
    <div class="card">
      <div class="stat"><span>Trackers con datos</span><b>${nt}</b></div>
      <div class="stat"><span>Filas (strings)</span><b>${filas.length}</b></div>
      <div class="stat"><span>Última exportación</span><b>${esc(leer(K.exp, "nunca"))}</b></div>
      <div class="stat"><span>Trackers modificados sin exportar</span><b>${nCambios()}</b></div>
    </div>
    <div class="card">
      <h2>Enviar a la oficina</h2>
      <p class="muted">Genera el archivo y compártelo por WhatsApp, correo o Drive cuando tengas señal. Funciona sin internet.</p>
      <button class="btn" id="exXlsx">Exportar Excel (.xlsx)</button>
      <button class="btn sec" id="exCsv">Exportar CSV</button>
      <button class="btn sec" id="exJson">Copia de seguridad (.json)</button>
    </div>
    <div class="card">
      <h2>Unir datos de otros técnicos</h2>
      <p class="muted">Carga archivos .json (copia de seguridad) o .csv exportados por esta app. Los datos se unen campo por campo (ej. un técnico anotó marquillas y otro el inversor). Si un mismo dato es distinto, se queda el más reciente y se lista para revisar.</p>
      <input type="file" id="imp" accept=".json,.csv,application/json,text/csv" multiple>
      <div id="impRes" class="muted" style="margin-top:8px"></div>
    </div>`;
  document.getElementById("exXlsx").onclick = async () => {
    if (!filas.length) return toast("Aún no hay datos para exportar");
    const blob = xlsx([
      { nombre: "Registro", cab: COLS, filas, anchos: ANCHOS },
      { nombre: "Novedades", cab: ["Subcampo", "Tracker real", "String", "Novedad"], filas: filasNovedades(), anchos: [10, 11, 7, 70] },
      { nombre: "Pendientes", cab: ["Subcampo", "Tracker", "Nombre completo", "Estado", "Marquillas", "En inversor"], filas: filasPendientes(), anchos: [10, 9, 16, 12, 11, 12] },
    ]);
    if (await compartir(blob, nombreArchivo("xlsx"))) { marcarExportado(); vistaExportar(); }
  };
  document.getElementById("exCsv").onclick = async () => {
    if (!filas.length) return toast("Aún no hay datos para exportar");
    if (await compartir(csv(filas), nombreArchivo("csv"))) { marcarExportado(); vistaExportar(); }
  };
  document.getElementById("exJson").onclick = async () => {
    const blob = new Blob([JSON.stringify({ app: "registro-strings", version: VERSION, tecnico: tecnico(), fecha: ahora(), registros }, null, 1)], { type: "application/json" });
    if (await compartir(blob, nombreArchivo("json"))) { marcarExportado(); vistaExportar(); }
  };
  document.getElementById("imp").onchange = async ev => {
    let nuevos = 0, actualizados = 0, conflictos = [], errores = [];
    for (const f of ev.target.files) {
      try {
        const texto = await f.text();
        const entrantes = f.name.toLowerCase().endsWith(".json") ? JSON.parse(texto).registros : desdeCsv(texto);
        if (!entrantes || typeof entrantes !== "object") throw new Error("formato no reconocido");
        for (const [id, r] of Object.entries(entrantes)) {
          const [sc, t] = id.split(".");
          if (!window.TRACKERS[sc]?.includes(t)) { errores.push(`${f.name}: ${id} no existe`); continue; }
          const actual = registros[id];
          if (!actual) { registros[id] = r; nuevos++; continue; }
          const [unido, dif, rec] = fusionar(actual, r);
          if (JSON.stringify(unido) !== JSON.stringify(actual)) { registros[id] = unido; actualizados++; }
          if (dif.length) conflictos.push(`${id}: ${dif.join(", ")} (quedó lo de ${rec.tec} ${rec.fecha})`);
        }
      } catch (e) { errores.push(`${f.name}: ${e.message}`); }
    }
    guardarRegistros();
    document.getElementById("impRes").innerHTML =
      `Nuevos: <b>${nuevos}</b> · Actualizados: <b>${actualizados}</b> · Con diferencias: <b>${conflictos.length}</b>` +
      (conflictos.length ? `<br><br>Trackers con datos distintos entre técnicos (revisar):<br>${conflictos.map(esc).join("<br>")}` : "") +
      (errores.length ? `<br><br><span style="color:var(--err)">${errores.slice(0, 20).map(esc).join("<br>")}</span>` : "");
  };
}

function desdeCsv(texto) {
  const filas = []; let f = [], v = "", q = false;
  texto = texto.replace(/^﻿/, "");
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (q) { if (ch === '"') { if (texto[i + 1] === '"') { v += '"'; i++; } else q = false; } else v += ch; }
    else if (ch === '"') q = true;
    else if (ch === ";" || ch === ",") { f.push(v); v = ""; }
    else if (ch === "\n") { f.push(v.replace(/\r$/, "")); filas.push(f); f = []; v = ""; }
    else v += ch;
  }
  if (v || f.length) { f.push(v); filas.push(f); }
  const cab = filas.shift().map(s => s.trim());
  const ix = n => cab.indexOf(n);
  const out = {};
  for (const r of filas) {
    const id = limpio(r[ix("Nombre completo")]);
    if (!id) continue;
    const i = parseInt(String(r[ix("String")]).replace(/\D/g, ""), 10) - 1;
    const o = out[id] ||= { n: parseInt(r[ix("Nº strings")], 10) || 4, s: [], obs: r[ix("Observaciones")] || "", tec: r[ix("Técnico")] || "", fecha: r[ix("Fecha")] || "" };
    if (i >= 0) o.s[i] = {
      mTr: aNum(r[ix("Marquilla tracker")]), mInv: aNum(r[ix("Marquilla inversor")]), mStr: aNum(r[ix("Marquilla string")]),
      inv: aNum(r[ix("Inversor conectado")]), ent: aNum(r[ix("PV")]),
    };
  }
  return out;
}

  cabecera("Ajustes", "#/");
  const total = Object.values(window.TRACKERS).reduce((a, t) => a + t.length, 0);
  app.innerHTML = `
    <div class="card">
      <label for="nom">Nombre del técnico</label>
      <input id="nom" value="${esc(tecnico())}">
      <button class="btn" id="okNom">Guardar nombre</button>
    </div>
    <div class="card">
      <div class="stat"><span>Subcampos</span><b>${Object.keys(window.TRACKERS).length}</b></div>
      <div class="stat"><span>Trackers en nomenclatura</span><b>${total}</b></div>
      <div class="stat"><span>Trackers con datos</span><b>${Object.keys(registros).length}</b></div>
      <div class="stat"><span>Versión</span><b>${VERSION}</b></div>
    </div>
    <div class="card">
      <h2>Borrar todo</h2>
      <p class="muted">Elimina todos los registros de este teléfono. Exporta antes una copia de seguridad.</p>
      <button class="btn peligro" id="borrarTodo">Borrar todos los datos</button>
    </div>`;
  document.getElementById("okNom").onclick = () => {
    const v = document.getElementById("nom").value.trim();
    if (!v) return toast("Escribe un nombre");
    escribir(K.tec, v); toast("Nombre guardado");
  };
  document.getElementById("borrarTodo").onclick = () => {
    const r = prompt('Escribe BORRAR para eliminar todos los registros de este teléfono');
    if (r !== "BORRAR") return;
    registros = {}; escribir(K.reg, registros); escribir(K.cambios, []); pintarBadge(); toast("Datos eliminados");
  };
}

function pintarBadge() {
  const c = nCambios(), b = document.getElementById("badge");
  b.textContent = c > 99 ? "99+" : c; b.classList.toggle("oculto", !c);
}

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");
// Normaliza los campos a números (por si hay registros de versiones anteriores)
for (const r of Object.values(registros)) (r.s || []).forEach(s => { if (s) CAMPOS.forEach(c => { s[c] = aNum(s[c]); }); });
pintarBadge();
enrutar();
</script>
